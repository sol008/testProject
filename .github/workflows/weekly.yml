# Sunday-evening run: the Bitcoin weekly trend switch (M3), for an order at Monday's open.
# Owner's guide: docs/OPERATIONS.md.
name: weekly

on:
  schedule:
    # Monday 01:17 and 02:17 UTC = Sunday 21:17 and 22:17 EDT (summer), or 20:17 and 21:17 EST (winter).
    # Both slots come after the Sunday UTC Bitcoin candle closes at 00:00 UTC. The CLI is idempotent
    # per date, so the later slot is a no-op when the earlier one succeeded, and a retry if it failed.
    # If you change these, update EARLY_SLOT below to the first one.
    - cron: "17 1 * * 1"
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "ET date to run for (YYYY-MM-DD), normally a Sunday. Leave empty for today in New York."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run: send and commit nothing; the would-be emails are attached to the run as an artifact."
        required: false
        type: boolean
        default: false
      force:
        description: "Force: redo the most recent run (only that one) from its pre-run snapshot; its emails go out again."
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # commit state/ back to the branch
  issues: write     # one issue per trade, where you record your fill

# Every workflow that writes state/ shares this group, so runs never overlap.
concurrency:
  group: traderec-state
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
      RUN_DATE: ${{ inputs.date }}
      # The first slot of the night; a later slot follows it and can retry.
      EARLY_SLOT: ${{ github.event.schedule == '17 1 * * 1' }}
    steps:
      - name: Check out the branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # An explicit ref checks out the branch as it is when this job starts, not the commit that
          # triggered it. A run that waited in the concurrency queue therefore sees the state that the
          # run before it committed.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialise state if missing
        run: python -m traderec init --if-missing

      - name: Run the weekly pipeline
        id: run
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          HC_PING_URL: ${{ secrets.HC_PING_URL_WEEKLY }}   # one healthchecks.io check per workflow
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          eml_count() { if [ -d state/outbox ]; then find state/outbox -maxdepth 1 -name '*.eml' | wc -l; else echo 0; fi; }
          eml_before="$(eml_count)"
          run_date="${RUN_DATE}"
          if [ -z "${run_date}" ] && [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            # Both slots fire before midnight in New York, on the UTC Monday after the Sunday evening.
            # Naming Sunday keeps a late-starting run on the same week instead of rolling over to Monday.
            run_date="$(date -u -d yesterday +%Y-%m-%d)"
          fi
          args=()
          if [ -n "${run_date}" ]; then
            if ! [[ "${run_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::date must look like YYYY-MM-DD (got '${run_date}')."
              exit 1
            fi
            args+=(--date "${run_date}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          if [ "${FORCE}" = "true" ]; then args+=(--force); fi
          echo "python -m traderec weekly ${args[*]}"
          status=0
          python -m traderec weekly "${args[@]}" || status=$?
          # With all four Gmail secrets set, a new .eml in state/outbox/ means a send failed: the pipeline keeps
          # a copy there and retries at the next run. A later step fails the job once the state is saved.
          if [ "${DRY_RUN}" != "true" ] && [ -n "${GMAIL_CLIENT_ID}" ] && [ -n "${GMAIL_CLIENT_SECRET}" ] \
            && [ -n "${GMAIL_REFRESH_TOKEN}" ] && [ -n "${ALERT_TO_EMAIL}" ]; then
            unsent=$(( $(eml_count) - eml_before ))
            if [ "${unsent}" -gt 0 ]; then echo "unsent=${unsent}" >> "${GITHUB_OUTPUT}"; fi
          fi
          # Exit code 3 = the data isn't published yet; nothing was saved. The later slot retries,
          # so only the first slot treats it as a warning.
          if [ "${status}" -eq 3 ] && [ "${EARLY_SLOT}" = "true" ]; then
            echo "::warning::Data not available yet (exit code 3); the 02:17 UTC slot will retry."
            echo "retry=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          exit "${status}"

      - name: Commit state changes
        if: env.DRY_RUN != 'true' && steps.run.outputs.retry != 'true'
        env:
          RUN_KIND: weekly
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "::error::State can only be committed to a branch (this run is on ${GITHUB_REF})."
            exit 1
          fi
          branch="${GITHUB_REF_NAME}"
          if [ ! -d state ]; then
            echo "No state/ folder; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all state/
          if git diff --cached --quiet; then
            echo "State unchanged; nothing to commit."
            exit 0
          fi
          git commit --quiet -m "state: ${RUN_KIND} run $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash --quiet origin "${branch}" && git push --quiet origin "HEAD:${branch}"; then
              echo "State committed and pushed to ${branch} (attempt ${attempt})."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Push attempt ${attempt} of 3 failed."
            if [ "${attempt}" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "::error::Could not push the state commit after 3 attempts. The run's state/ folder is attached to this run as an artifact; see docs/OPERATIONS.md, Troubleshooting."
          exit 1

      - name: Fail if Gmail refused an email
        if: steps.run.outputs.unsent != ''
        env:
          UNSENT: ${{ steps.run.outputs.unsent }}
        run: |
          echo "::error::${UNSENT} email(s) could not be sent through Gmail. A copy is in state/outbox/ and the next run retries it. The pipeline log says why ('email not sent: ...'); an expired refresh token is the usual cause. See docs/OPERATIONS.md, Troubleshooting."
          exit 1

      - name: Upload state/ (dry runs and failures)
        if: always() && (env.DRY_RUN == 'true' || failure())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: state-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: state/
          if-no-files-found: ignore
          retention-days: 14

      # The pipeline reports each run to healthchecks.io itself (start, then success or fail).
      # This adds a fail signal for what happens outside it: setup, the state commit, a timeout.
      - name: Tell healthchecks.io the job failed
        if: always() && env.DRY_RUN != 'true' && job.status != 'success'
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL_WEEKLY }}
        run: |
          if [ -z "${HC_PING_URL}" ]; then
            echo "HC_PING_URL_WEEKLY is not set; no ping."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "${HC_PING_URL}/fail" \
            || echo "::warning::Could not reach healthchecks.io."
