[project]
name = "traderec"
version = "0.1.0"
description = "Few-trade, evidence-gated trade recommendation system (paper phase): rules, paper broker, ledger, plain-English emails."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "PyYAML>=6.0",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["traderec*"]
