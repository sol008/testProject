# War onsets for the gold spike fade (track 17 §3.1 and R2: "Gold's day-0 war spike reversed the next day in
# 8 of 8 war onsets"). Which events count is a judgment the shadow book cannot make without an LLM, so the
# owner lists them here, ideally the evening they happen. `date` is the news date in New York time;
# `during_session: false` means the news broke after the close or on a non-trading day, so day 0 is the next
# session. An onset the runner first sees after its day-0 evening is recorded but not counted toward the
# promotion test, because its outcome may already have been known when it was added.
# Example (track 17's last one):
#   - {date: "2026-02-28", label: "US/Israel-Iran war begins", during_session: false}
geopolitical_onsets: []
