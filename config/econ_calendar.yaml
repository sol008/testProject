# Scheduled macro releases for the macro shadow books (traderec/runners/macro_shadows.py).
# Design v3.3 §3 M5 "Scheduled releases. Never traded; logged for calibration only" and §3 "Shadow ledger";
# research/17-short-horizon-macro-events.md R1. This file is data, not a rule: editing it is not a
# constitution change. Read by traderec/data/econ_calendar.py.
#
# Every date was checked on 2026-09-29 against the official schedule cited on its kind (`source`).
# - `date`: the release or decision date. The market reacts in the first NYSE session on or after it: every
#   release here comes before the 16:00 ET close. The BoJ announces around noon Tokyo time, which is the
#   evening before in New York, so its reaction session is the US session dated `date`.
# - `covered`: the span in which every release of the kind is listed. Outside it the runner cannot tell a
#   release day from an ordinary one, so it raises a data alert each month until the dates are added.
#   On 2026-09-29 neither BLS nor BEA had published its 2027 schedule. Add those dates when they appear,
#   then move `covered` and `verified` forward.
# - A release that is postponed (a government shutdown, for example) gets `status: postponed`. The runner
#   skips it and voids any record it already made. Add the new date as a separate line.
# - `verified`: the date of the last full check. The runner alerts once this is older than
#   shadow.MACRO.reverify_days (constitution.yaml).
verified: "2026-09-29"

