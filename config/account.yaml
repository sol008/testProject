# Accounts the system trades for. Paper phase: balances are notional.
# Venue rules verified 2026-09-29 (research/20-executability-check.md):
#   - Robinhood IRAs allow Level 2 options only (no spreads) -> ETFs and IBIT live in the IRA.
#   - Option spreads (Phase B) live in the taxable account (Level 3 + index options).
#   - Coinbase is optional (off by default): M3 uses IBIT in the IRA unless you switch it here.
mode: paper            # paper | live  (live requires the go-live gates in the design, section 7)
timezone: America/New_York
paper_notional: 100000

accounts:
  ira:
    broker: Robinhood
    name: Robinhood IRA
    kind: ira                  # no shorts, no futures, no spreads
    start_cash: 80000          # M2 up to 60% of NAV + M1 6% + W10 6% + M3 3% = 75%, plus a buffer (v3.3)
    options_level: 2
  taxable:
    broker: Robinhood
    name: Robinhood individual (margin)
    kind: taxable_margin
    start_cash: 20000          # Phase B option spreads: premium capped at 10% of NAV
    options_level: 3           # spreads + index options (XSP) - Phase B
  coinbase:
    broker: Coinbase
    name: Coinbase
    kind: crypto
    enabled: false
    start_cash: 0

email:
  to_env: ALERT_TO_EMAIL       # recipient address comes from this environment variable / secret
  from_name: Trade system
github_issues: true            # one issue per trade (fills are recorded as comments), when running in Actions
