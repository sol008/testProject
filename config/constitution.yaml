# Strategy constitution v3.3 (research/00-SYSTEM-DESIGN-v3.md). Changing anything here is a
# rule change: see design section 8 (at most one change per parameter per quarter, with evidence).
# v3.3 (decision 12): W10 becomes a policy module with a 90-day exception; every other rule keeps 60 days.
version: "3.3.0"

holding:
  max_calendar_days: 60          # every trade closes within 60 calendar days (decision 1)
  exceptions:                    # decision 12: holds to the last session within 90 calendar days
    W10: 90
    M4: 90                       # Phase B
  continuing: [M2, M3]           # re-decided monthly / weekly; may continue (decisions 5 and 11)

modules:
  M1:                      # ST-1: VIX-gated uptrend dip-buy (policy module), track 13 §11.1
    enabled: true
    name: Uptrend dip-buy
    ticker: SPY
    account: ira
    notional_pct_nav: 0.06
    sma_trend: 200
    rsi_period: 2
    rsi_below: 10
    vix_min: 20.0
    exit_sma: 5
    max_sessions: 20       # time stop: sell at the open of session 21
    stress_loss: 0.326     # S&P 500 worst 10-session loss (track 13 §3.4)
    base_rates:            # track 13, out-of-sample 2008-2026
      trades_per_year: 3.8
      win_rate: 0.82
      mean_pct: 0.88
      planning_mean_pct: 0.43
      median_hold_sessions: 3
      worst_pct: -9.4
      max_drawdown_pct: -14
    forecasts:             # pre-registered, scored monthly
      p_profit: 0.75       # shrunk from 0.82
      p_time_stop: 0.10

  M2:                      # R1: slow multi-asset trend, long-only ETF8 in the IRA, track 15 R1
    enabled: true
    name: Trend book
    account: ira
    legs:
      SPY: us_equity
      QQQ: us_equity
      IEF: duration
      GLD: gold
      USO: oil
      FXE: usd
      FXY: usd
      FXA: usd
    lookback_sessions: 252
    vol_target_per_leg: 0.035
    ewma_span: 60
    scale: 0.5
    long_only: true
    gross_cap_pct_nav: 0.60
    single_leg_cap_pct_nav: 0.25
    us_equity_stress_cap_pct_nav: 0.03
    sleeve_stress_pct_nav: 0.045     # worst historical book month at s = 0.5 (track 15)
    band_rel: 0.25
    band_abs_usd: 300
    max_orders_per_email: 3
    contango_veto_roll_yield: -0.20  # R3: no long crude leg in steep contango (checked when data is available)
    forecasts:
      p_leg_up_next_month: 0.54

  M3:                      # R2: Bitcoin weekly trend switch (policy module, opt-in sleeve), track 15 R2
    enabled: true
    name: Bitcoin trend switch
    ticker: IBIT
    account: ira
    sleeve_pct_nav: 0.03
    weeks: 10
    forecasts:
      p_profit: 0.45

  W10:                     # uptrend crash-day buy: policy module with a 90-day exception (design v3.3 §3, track 23)
    enabled: true
    name: Uptrend crash-day buy
    ticker: SPY
    index: "^GSPC"
    account: ira
    drop_pct: -0.03          # S&P close 3.00% or more below the prior close (unrounded)
    sma_trend: 200           # prior close above its 200-day average, computed through the prior close
    decluster_sessions: 20   # no other -3% close in the prior 20 sessions
    notional_pct_nav: 0.06   # x G(D); 6.7% would breach the 2% per-trade stress cap
    stress_loss: 0.326       # S&P 500 worst 10-session loss (as M1)
    horizon_stress_loss: 0.481   # worst 90-day window: the planning worst case shown in emails
    max_calendar_days: 90    # sell at the open of the last session within 90 calendar days of entry
    cluster_min_fraction: 0.5    # skip when the US-equity reserve leaves less than half the size
    kill_switch:
      single_trade_loss: -0.15   # one trade losing 15% or more sends W10 back to shadow
      cumulative_pnl_pct_nav: -0.015
    base_rates:              # track 23, SPY 1993-2026, calendar-exact 90 days, one position at a time
      since: 1993
      trades_per_year: 0.5
      win_rate: 0.88
      mean_pct: 7.2
      placebo_mean_pct: 2.7
      planning_mean_pct: 3.6
      worst_pct: -8.3
      worst_interim_pct: -31
      worst_interim_when: March 2020
      edge_since: 1990       # no edge before 1990 (1928-89: p 0.44)
    forecasts:
      p_profit: 0.72         # shrunk from 0.88 (1928-2026: 0.72)

  # ---- Phase B (design v3.3 §10; docs/PHASE_B_CONTRACTS.md §10). Each block is completed by its build. ----

  M4:                      # O2 crash call debit spread: policy module, 90-day exception (design v3.3 §3 M4)
    enabled: true
    name: Crash call spread
    index: "^GSPC"           # the S&P 500 close, two-source checked and the rule re-run on it (as W10's)
    root: XSP                # XSP preferred (design §3a.4): cash-settled, European-style, Section 1256
    fallback_root: SPY       # only when XSP fails the liquidity check (design §3 M4, §4 "Option liquidity")
    account: taxable         # Robinhood individual account: IRAs allow no spreads (design §3a.1)
    drop_from_high: -0.15    # close 15% or more below its 252-session high (closes, today's included; track 14 s05)
    high_sessions: 252
    vix_min: 30.0            # VIX close 30 or higher
    cooldown_days: 90        # first day only; 90-day cool-down = one spread at a time (decision 12; track 23 §4.2 C)
    max_calendar_days: 90    # the listed expiry nearest to, but not beyond, entry (next session) + 90 calendar days
    min_dte: 40              # no option with fewer than 40 days to expiry at entry (design §4; contract §2)
    short_strike_ratio: 1.05 # buy the at-the-money call, sell the 105% call
    strike_tolerance: 0.01   # a chosen strike more than 1% from its target means no trade (fail closed)
    spot_tolerance: 0.01     # the chain's spot must agree with the verified close within 1% (fail closed)
    debit_pct_nav: 0.02      # debit <= 2% of NAV, nearest whole contract within the 3% premium cap (design §4)
    close_sessions_before_expiry: 2  # close >= 1 trading day before expiry: planned two sessions before, one retry left
    probe_drawdown: -0.10    # snapshot XSP and SPY at 10:17 ET while the last close is 10% below its high, so the
                             # liquidity check is measured in market hours (design §4)
    base_rates:              # track 21 §2.1 (o2_mid_summary.csv): 90 DTE, next-day entry (mid of the next-open and
                             # next-close proxies), frozen fill model, all 26 signals 1990-2026 in 12 episodes;
                             # returns per trade in % of the debit (model-priced surface)
      since: 1990
      signals: 26
      episodes: 12
      trades_per_year: 0.6   # one spread at a time (90-day cool-down): 22 signals in 36.6 years (track 23 §3.5)
      win_rate: 0.69
      mean_pct: 36
      median_pct: 78
      worst_pct: -100
      lost_all_share: 0.15   # 4 of 26 lost the whole debit
      is_mean_pct: 7         # 1990-2007
      oos_mean_pct: 58       # 2008-2026
      oos_since: 2008
      placebo_mean_pct: 12   # the same spread bought after random sessions (+-3 years): edge +0.23, p 0.21
      contribution_pct_nav_year: 0.04   # planning, at kappa 0.25 (+0.13 at kappa 0.5); design §6, track 23 §3.2
    forecasts:
      p_profit: 0.60         # 0.57 + 0.25 x (0.69 - 0.57): any-day 90-DTE spread win rate, O2's win rate, kappa 0.25

  # ----

  W8:                      # de-escalation confirmed: policy module, small (design v3.3 §3 M5)
    enabled: false

  # ----

  W9:                      # escalation that removes barrels: paper (design v3.3 §3 M5)
    enabled: false

shadow:                    # logged automatically, never emailed
  ST1B:
    enabled: true          # M1 without the VIX gate
  W10:
    enabled: true          # every uptrend -3% day, scored at 60 and 90 calendar days (W10's annual-review record)
    score_calendar_days: [60, 90]

  # ---- Phase B shadow books (design v3.3 §3 "Shadow ledger"). Each block is completed by its build. ----

  M4_TWIN:                 # M4's 60-DTE paper twin (design v3.3 §3 M4, "90-day exception"; track 23 §4.2 C)
    enabled: true          # M4's signal; entered and exited at model prices at the 10:17 ET snapshots
    root: XSP
    max_calendar_days: 60  # the listed expiry nearest to, but not beyond, entry + 60 calendar days
    min_dte: 40
    max_entry_delay_sessions: 2   # no usable snapshot within two sessions of the entry session: entry missed

  # ----

  O1:                      # M7: trend-filtered put credit spread (shadow at the $100k paper size)
    enabled: false

  # ----

  O1H:                     # O1 held to expiry
    enabled: false

  # ----

  I1:                      # put-spread variant I1 (track 14)
    enabled: false

  # ----

  I2:                      # put-spread variant I2 (track 14)
    enabled: false

  # ----

  ST2:                     # VIX/VIX3M inversion in an uptrend, hold 20 sessions (track 13 §11.3)
    enabled: false

  # ----

  ETH:                     # ETH weekly trend switch (M3's rule on ETH)
    enabled: false

  # ----

  M6:                      # crypto structural: depeg buy and cash-and-carry (hourly 24/7 job)
    enabled: false

  # ----

  EDGAR:                   # insider clusters, special dividends, activist 13D, cash mergers, CEF tenders (track 16)
    enabled: false

  # ----

  MACRO:                   # W3 cool-CPI TLT, W4 BoJ, gold spike fade, scheduled-release reactions (track 17)
    enabled: false

risk:
  governor:
    full_until: 0.05
    floor_at: 0.15
    floor: 0.25
    review_at: 0.15
    pause_discretionary_at: 0.20
  caps:
    per_trade_stress: 0.02
    us_equity_cluster: 0.07          # 3% M2 legs + 4% reserved for M1 / W10 / M4
    total_open_stress: 0.10
  trade_budget_per_year: 100
  max_open_positions: 8
  stress_floor: 0.15                 # minimum 10-session stress assumed for any ETF
  crypto_stress: 0.45                # IBIT stress (BTC worst 10-session loss scale)

fills:                                # fill model v1.0 (frozen for the paper phase)
  model_version: "1.0"
  slippage_bps:
    default: 3
    SPY: 1
    QQQ: 1
    IEF: 2
    GLD: 2
    IBIT: 3
    USO: 8
    FXE: 8
    FXY: 8
    FXA: 8
  options:                            # two-leg spreads (Phase B): model price = mid +/- concession x natural width
    concession: 0.3                   # = mid + 0.6 x half-spread per leg; fills only within the order's limit
    max_concession: 0.5               # the stated maximum for the one re-price: the natural price
    multiplier: 100

# ---- Phase B options settings (docs/PHASE_B_CONTRACTS.md §1, §5). Completed by the options build. ----
options:
  enabled: false

data:
  two_source_tolerance: 0.001         # 0.1% close mismatch blocks new signals
  fallback_tbill_rate: 0.04
