# Strategy constitution v4.0 (research/00-SYSTEM-DESIGN-v4.md on top of v3's rules, research/00-SYSTEM-DESIGN-v3.md).
# Changing anything here is a rule change: see design section 8 (at most one change per parameter per quarter, with
# evidence).
# v3.3 (decision 12): W10 becomes a policy module with a 90-day exception; every other rule keeps 60 days.
# v4.0 (2026-09-29): the growth book (`growth:` block; design v4 §3-§4): G1 leveraged index trend, G2 Bitcoin switch,
# G3 gems reserve, W10 in the Sunday email, the book-level governor and hard stop; M1/M4/W8/W9 to shadow, M2 retired,
# M3 superseded by G2 (the `status` keys). Paper mode until the design v4 §7 gates pass.
version: "4.0.0"

holding:
  max_calendar_days: 60          # every trade closes within 60 calendar days (decision 1)
  exceptions:                    # decision 12: holds to the last session within 90 calendar days
    W10: 90
    M4: 90                       # Phase B
  continuing: [M2, M3]           # re-decided monthly / weekly; may continue (decisions 5 and 11)

modules:
  M1:                      # ST-1: VIX-gated uptrend dip-buy (policy module), track 13 §11.1
    enabled: true
    status: shadow           # design v4 §3 table (Phase C1 records it; the daily job still runs the v3.3 rule)
    name: Uptrend dip-buy
    ticker: SPY
    account: ira
    notional_pct_nav: 0.06
    sma_trend: 200
    rsi_period: 2
    rsi_below: 10
    vix_min: 20.0
    exit_sma: 5
    max_sessions: 20       # time stop: sell at the open of session 21
    stress_loss: 0.326     # S&P 500 worst 10-session loss (track 13 §3.4)
    base_rates:            # track 13, out-of-sample 2008-2026
      trades_per_year: 3.8
      win_rate: 0.82
      mean_pct: 0.88
      planning_mean_pct: 0.43
      median_hold_sessions: 3
      worst_pct: -9.4
      max_drawdown_pct: -14
    forecasts:             # pre-registered, scored monthly
      p_profit: 0.75       # shrunk from 0.82
      p_time_stop: 0.10

  M2:                      # R1: slow multi-asset trend, long-only ETF8 in the IRA, track 15 R1
    enabled: true
    status: retired          # design v4 §3 table (Phase C1 records it; the daily job still runs the v3.3 rule)
    shadow_series: true
    name: Trend book
    account: ira
    legs:
      SPY: us_equity
      QQQ: us_equity
      IEF: duration
      GLD: gold
      USO: oil
      FXE: usd
      FXY: usd
      FXA: usd
    lookback_sessions: 252
    vol_target_per_leg: 0.035
    ewma_span: 60
    scale: 0.5
    long_only: true
    gross_cap_pct_nav: 0.60
    single_leg_cap_pct_nav: 0.25
    us_equity_stress_cap_pct_nav: 0.03
    sleeve_stress_pct_nav: 0.045     # worst historical book month at s = 0.5 (track 15)
    band_rel: 0.25
    band_abs_usd: 300
    max_orders_per_email: 3
    contango_veto_roll_yield: -0.20  # R3: no long crude leg in steep contango (checked when data is available)
    forecasts:
      p_leg_up_next_month: 0.54

  M3:                      # R2: Bitcoin weekly trend switch (policy module, opt-in sleeve), track 15 R2
    enabled: true
    status: "superseded_by: G2"   # design v4 §3 table: the weekly job runs G2 instead of M3 while growth.enabled
    name: Bitcoin trend switch
    ticker: IBIT
    account: ira
    sleeve_pct_nav: 0.03
    weeks: 10
    forecasts:
      p_profit: 0.45

  W10:                     # uptrend crash-day buy: policy module with a 90-day exception (design v3.3 §3, track 23)
    enabled: true
    status: active           # design v4 §3 table: policy module, folded into the Sunday email (growth.sleeves.W10)
    name: Uptrend crash-day buy
    ticker: SPY
    index: "^GSPC"
    account: ira
    drop_pct: -0.03          # S&P close 3.00% or more below the prior close (unrounded)
    sma_trend: 200           # prior close above its 200-day average, computed through the prior close
    decluster_sessions: 20   # no other -3% close in the prior 20 sessions
    notional_pct_nav: 0.06   # x G(D); 6.7% would breach the 2% per-trade stress cap
    stress_loss: 0.326       # S&P 500 worst 10-session loss (as M1)
    horizon_stress_loss: 0.481   # worst 90-day window: the planning worst case shown in emails
    max_calendar_days: 90    # sell at the open of the last session within 90 calendar days of entry
    cluster_min_fraction: 0.5    # skip when the US-equity reserve leaves less than half the size
    kill_switch:
      single_trade_loss: -0.15   # one trade losing 15% or more sends W10 back to shadow
      cumulative_pnl_pct_nav: -0.015
    base_rates:              # track 23, SPY 1993-2026, calendar-exact 90 days sold at the open, one position at a time
      since: 1993            # (re-run in Phase B: track 23 had priced these exits at the close; docs/phase-b/track23-fix.md)
      trades_per_year: 0.5
      win_rate: 0.88         # 15 of 17 trades (unchanged by the fix)
      mean_pct: 7.6          # was 7.2 with the close exit
      placebo_mean_pct: 2.7  # random entry days held just as long (2.65-2.67%, unchanged)
      planning_mean_pct: 3.8 # half the mean (was 3.6)
      worst_pct: -8.6        # Feb 2020 entry (was -8.3)
      worst_interim_pct: -31
      worst_interim_when: March 2020
      edge_since: 1990       # no edge before 1990 (1928-89: p 0.44)
    forecasts:
      # Shrinkage: SPY 1993-2026's 0.88 is replaced by the full-history rate, CAL90 one at a time on the S&P 500
      # total return 1928-2026 (34 of 47 trades won = 0.72), which includes the pre-1990 era where the edge is absent.
      # Neither rate moved with the Phase B fix (the index samples exit at the close by design; SPY stays 15 of 17).
      p_profit: 0.72

  # ---- Phase B (design v3.3 §10; docs/PHASE_B_CONTRACTS.md §10). Each block is completed by its build. ----

  M4:                      # O2 crash call debit spread: policy module, 90-day exception (design v3.3 §3 M4)
    enabled: true
    status: shadow           # design v4 §3 table, decision 6 (Phase C1 records it; the options job still runs M4)
    name: Crash call spread
    index: "^GSPC"           # the S&P 500 close, two-source checked and the rule re-run on it (as W10's)
    root: XSP                # XSP preferred (design §3a.4): cash-settled, European-style, Section 1256
    fallback_root: SPY       # only when XSP fails the liquidity check (design §3 M4, §4 "Option liquidity")
    account: taxable         # Robinhood individual account: IRAs allow no spreads (design §3a.1)
    drop_from_high: -0.15    # close 15% or more below its 252-session high (closes, today's included; track 14 s05)
    high_sessions: 252
    vix_min: 30.0            # VIX close 30 or higher
    cooldown_days: 90        # first day only; 90-day cool-down = one spread at a time (decision 12; track 23 §4.2 C)
    max_calendar_days: 90    # the listed expiry nearest to, but not beyond, entry (next session) + 90 calendar days
    min_dte: 40              # no option with fewer than 40 days to expiry at entry (design §4; contract §2)
    short_strike_ratio: 1.05 # buy the at-the-money call, sell the 105% call
    strike_tolerance: 0.01   # a chosen strike more than 1% from its target means no trade (fail closed)
    spot_tolerance: 0.01     # the chain's spot must agree with the verified close within 1% (fail closed)
    debit_pct_nav: 0.02      # debit <= 2% of NAV, nearest whole contract within the 3% premium cap (design §4)
    close_sessions_before_expiry: 2  # close >= 1 trading day before expiry: planned two sessions before, one retry left
    probe_drawdown: -0.10    # snapshot XSP and SPY at 10:17 ET while the last close is 10% below its high, so the
                             # liquidity check is measured in market hours (design §4)
    base_rates:              # track 21 §2.1 (o2_mid_summary.csv): 90 DTE, next-day entry (mid of the next-open and
                             # next-close proxies), frozen fill model, all 26 signals 1990-2026 in 12 episodes;
                             # returns per trade in % of the debit (model-priced surface)
      since: 1990
      signals: 26
      episodes: 12
      trades_per_year: 0.6   # one spread at a time (90-day cool-down): 22 signals in 36.6 years (track 23 §3.5)
      win_rate: 0.69
      mean_pct: 36
      median_pct: 78
      worst_pct: -100
      lost_all_share: 0.15   # 4 of 26 lost the whole debit
      is_mean_pct: 7         # 1990-2007
      oos_mean_pct: 58       # 2008-2026
      oos_since: 2008
      placebo_mean_pct: 12   # the same spread bought after random sessions (+-3 years): edge +0.23, p 0.21
      contribution_pct_nav_year: 0.04   # planning, at kappa 0.25 (+0.13 at kappa 0.5); design §6, track 23 §3.2
    forecasts:
      p_profit: 0.60         # 0.57 + 0.25 x (0.69 - 0.57): any-day 90-DTE spread win rate, O2's win rate, kappa 0.25

  # ----

  W8:                      # de-escalation confirmed: policy module, small (design v3.3 §3 M5)
    enabled: true
    name: De-escalation call spread
    status: shadow                   # design v4 §3 table (was "policy module, small"; the email label is in email_text)
    account: taxable                 # option spreads live in the taxable account (design §3a.1)
    cluster: oil                     # "peace/oil-down" is one factor in 2026 (design §4; contract §7)
    premium_pct_nav: 0.01            # premium <= 1% of NAV, at the stated maximum debit (design §3 M5)
    # Trigger, all at the close (design §3 M5; track 17 §5.2 W8 (i)-(iii)). (i), the official announcement, is
    # evidenced by the veto's allow-listed citations (docs/phase-b/w8w9.md).
    oil_drop: -0.06                  # (ii) Brent (explicit front-safe month, BZZ26 in late Sep 2026) or BNO down >= 6%
    oil_etf: BNO
    pm_jump: 0.15                    # (iii) the blockade-end or Hormuz-normal market up >= 15 points on the day ...
    pm_through: 0.75                 #       ... or through 75%
    trigger_market_days: 90          # map rule: listed date nearest signal + 90 days, on or after the time stop
                                     # (= "by Dec 31" on 28 Sep 2026, track 17's market)
    markets:                         # the rolling, rule-based map (design §10); each pattern matches the whole name
      trigger:
        blockade_end: {venue: polymarket, query: "Iranian blockade",
                       pattern: '^US announces end of Iranian blockade by (?P<date>[A-Z][a-z]+ \d{1,2}(?:, \d{4})?)\?$'}
        hormuz_normal: {venue: polymarket, query: "Strait of Hormuz traffic returns to normal",
                        pattern: '^Strait of Hormuz traffic returns to normal by (?P<date>[A-Z][a-z]+ \d{1,2}(?:, \d{4})?)\?$'}
      invalidation: {venue: polymarket, query: "US x Iran ceasefire continues",
                     pattern: '^US(?: x |-)Iran ceasefire continues through (?P<date>[A-Z][a-z]+ \d{1,2}(?:, \d{4})?)\?$'}
    # Trade (design §3 M5): call debit spreads, 56-75 DTE; DAL legs expire before DAL's next earnings.
    roots: [XSP, SPY, DAL]           # first root that passes every rule: XSP preferred (design §3a.4; 1256 tax, track 17 §6)
    moneyness:                       # long / short strike as a multiple of spot (track 17 §4.5 and §5.2 examples)
      XSP: [1.015, 1.04]             # SPY Dec 780/800 call spread at spot ~768
      SPY: [1.015, 1.04]
      DAL: [1.01, 1.13]              # DAL Dec 85/95 call spread at spot ~84
    earnings_roots: [DAL]            # single-stock legs expire before the next earnings date (design §5; red team M5)
    dte_min: 56                      # >= 2 x a 20-trading-day hold (design §4 "Option expiry"; red team M5)
    dte_max: 75
    # Exits (design §3 M5): the first of these, checked every evening; the order goes out for the next session.
    time_stop_sessions: 20           # after 20 trading days
    take_profit_frac_of_max: 0.80    # at 80% of maximum value
    invalidation_below: 0.40         # "US x Iran ceasefire continues through <first listed date >= the time stop>" < 40%
    expiry_close_sessions: 10        # close >= 10 trading days before expiry (design §4 "Option expiry")
    release_ban:                     # never-list (design §5; red team M5): no entry <= 5 sessions before a release
      sessions: 5
      series: {FOMC: KXFEDDECISION, CPI: KXCPI, NFP: KXPAYROLLS}   # Kalshi release calendars (track 14 §7.5 veto 1)
    circuit_breakers: {daily_loss: -0.02, weekly_loss: -0.04, weekly_sessions: 5, weekly_pause_sessions: 5}  # design §4
    liquidity:                       # fallback when options.liquidity is absent (design §4 "Option liquidity"; track 17 R8)
      max_leg_spread_frac_of_mid: 0.10
      min_open_interest: 500
      max_round_trip_frac_of_debit: 0.10
      max_round_trip_frac_if_gain_2x_costs: 0.20
    veto:                            # the frozen LLM veto (design §3 M5; red team M9); model: env TRADEREC_VETO_MODEL
      prompt_sha256: "3b7f90295c962b8048a9528d25bb833a9b0f47f7fa0094e1dcde49cabb23f942"   # llm_veto refuses another
      web_search_tool: web_search_20260318   # server-side web search type (API docs checked 2026-09-29)
      max_searches: 5
      max_tokens: 16000
      max_continuations: 2
      min_citations: 2               # PROCEED needs >= 2 allow-listed pages that the search returned
      allowed_domains: [whitehouse.gov, state.gov, war.gov, defense.gov, centcom.mil, treasury.gov, un.org, iaea.org,
                        mfa.ir, president.ir, fm.gov.om, mofa.gov.qa]
    base_rates: {since: 1953, trades_per_year: 0.23}   # 17 de-escalations in 73 years (track 17 §3.4)
    history: {events: 17, since: 1953, horizon_sessions: 20, spx_up_rate: 0.76, short_adverse_pct: 8.6}  # track 17 §3.4, §4.2
    forecasts:                       # pre-registered, scored at the exit
      p_profit: 0.50                 # track 17 §5.2: P(SPY call spread profitable) ~50-55% after 75% shrinkage
      p_time_stop: 0.60              # the take-profit needs ~+4% in 20 days; the invalidation fires on failed deals

  # ----

  W9:                      # escalation that removes barrels: paper (design v3.3 §3 M5)
    enabled: true
    name: Barrel-loss oil call spread
    status: shadow                   # design v4 §3 table (was "paper module"; the email label is in email_text)
    paper_only: true                 # n = 5: paper unless the owner opts in as a hedge exception (design §3 M5)
    account: taxable
    cluster: oil                     # contract §7
    premium_pct_nav: 0.0075          # <= 0.75% of NAV (design §3 M5)
    oil_jump: 0.05                   # front Brent/WTI (explicit front-safe months) up >= 5% on the day
    supply_input: inputs/w9_supply_loss.json   # the owner's ">= 1 mb/d physically offline" record, in the state dir
    supply:                          # track 17 R2: per IEA/EIA/company statements; validated mechanically, fail closed
      min_mbd_offline: 1.0
      min_no_restoration_days: 14    # "no restoration or bypass path inside ~2 weeks"
      min_citations: 2
      source_domains: [iea.org, eia.gov, energy.gov, opec.org, aramco.com, adnoc.ae, qatarenergy.qa, kpc.com.kw,
                       spa.gov.sa, wam.ae, ukmto.org, imo.org, centcom.mil]
    contango_veto_roll_yield: -0.20  # R3: no long USO when the front WTI roll yield is below -20% a year (design §4)
    roots: [USO]
    moneyness: {USO: [1.10, 1.33]}   # USO Dec 165/200 call spread at spot ~150 (track 17 §4.5, §5.2 W9)
    dte_min: 56
    dte_max: 75
    time_stop_sessions: 20           # 20-day time stop (design §3 M5); trading days (track 17 R6)
    take_profit_multiple: 2.0        # +100% of the premium (track 17 §5.2 W9; the design is silent)
    expiry_close_sessions: 10
    release_ban:
      sessions: 5
      series: {FOMC: KXFEDDECISION, CPI: KXCPI, NFP: KXPAYROLLS}
    circuit_breakers: {daily_loss: -0.02, weekly_loss: -0.04, weekly_sessions: 5, weekly_pause_sessions: 5}
    liquidity:
      max_leg_spread_frac_of_mid: 0.10
      min_open_interest: 500
      max_round_trip_frac_of_debit: 0.10
      max_round_trip_frac_if_gain_2x_costs: 0.20
    veto:
      prompt_sha256: "0702d3bab41f5a6073531791024475e08706f8f7d26e3d5fa53810ec671df920"
      web_search_tool: web_search_20260318
      max_searches: 5
      max_tokens: 16000
      max_continuations: 2
      min_citations: 2
      allowed_domains: [iea.org, eia.gov, energy.gov, opec.org, aramco.com, adnoc.ae, qatarenergy.qa, kpc.com.kw,
                        spa.gov.sa, wam.ae, ukmto.org, imo.org, centcom.mil]
    base_rates: {since: 1990, trades_per_year: 0.14}   # 5 lasting supply losses in 36 years (track 17 §3.3)
    history: {events: 5, since: 1990, horizon_sessions: 20, wti_mean_20d_pct: 16.7}   # track 17 §3.3
    forecasts:
      p_profit: 0.40                 # track 17 §5.2 W9: P(USO above breakeven) ~40-45% after shrinkage
      p_time_stop: 0.45

shadow:                    # logged automatically, never emailed
  ST1B:
    enabled: true          # M1 without the VIX gate
  W10:
    enabled: true          # every uptrend -3% day, scored at 60 and 90 calendar days (W10's annual-review record)
    score_calendar_days: [60, 90]

  # ---- Phase B shadow books (design v3.3 §3 "Shadow ledger"). Each block is completed by its build. ----

  M4_TWIN:                 # M4's 60-DTE paper twin (design v3.3 §3 M4, "90-day exception"; track 23 §4.2 C)
    enabled: true          # M4's signal; entered and exited at model prices at the 10:17 ET snapshots
    root: XSP
    max_calendar_days: 60  # the listed expiry nearest to, but not beyond, entry + 60 calendar days
    min_dte: 40
    max_entry_delay_sessions: 2   # no usable snapshot within two sessions of the entry session: entry missed

  # ----

  O1:                      # M7: trend-filtered put credit spread (shadow at the $100k paper size)
    enabled: true          # design v3.3 §3 M7, §6; track 14 §3.2-§3.3, §7.1-§7.6. Paper only from ≈$162k
    name: Trend-filtered put credit spread (M7)
    root: XSP              # XSP/SPXW (design §3 M7); XSP is the size that fits below ≈$1.1M (track 14 §6.1)
    index: "^GSPC"         # the trend filter and the settlement use the S&P 500's official close
    settle_scale: 0.1      # XSP settles on the S&P 500 close / 10
    signal: o1_filters
    filters:               # design §3 M7 "Filters" (track 14 §7.2), at the close before the entry
      sma_trend: 200       # S&P 500 close above its 200-day average
      vix_below: 30.0      # VIX < 30
      vix_ratio_below: 1.0 # VIX/VIX3M < 1.0
    entry_window_dte: [40, 45]   # one entry per monthly (third-Friday) cycle, from 45 DTE (the tested entry,
                                 # track 14 §3.2) down to 40 (design: 40-50 DTE; never below 40)
    expiry_dte: [40, 50]   # when the monthly is not listed, the listed expiry nearest it in this range
    target_dte: 45
    short_delta: 0.20      # sell the 0.20-delta put (0.15-0.25, track 14 §7.1)
    delta_tolerance: 0.05
    width_pct_spot: 0.05   # buy the put 5% of spot lower (4-6%)
    width_tolerance: 0.01
    take_profit_at: 0.5    # buy back when that costs <= 50% of the credit, checked at each 10:17 ET snapshot
    exit_dte: 21           # otherwise close at the first 10:17 ET snapshot with <= 21 days to expiry; no stop
    hold_to_expiry: false
    max_open: 1
    liquidity:             # track 14 §7.2: natural combo spread <= 10% of the mid credit; the spread test
      max_natural_frac_of_credit: 0.10   # governs for index options (market-maker quoted strikes)
      min_open_interest: 0
    size:                  # design §3 M7: 2% of NAV at max loss (3% cap): one XSP spread needs ≈$162k
      max_loss_pct_nav: 0.02
    promotion:             # track 14 §7.6: >= 24 paper trades (or 30 months), mean R >= model - 2 SE
      min_trades: 24
      max_months: 30
      model_mean_r: 0.02
      model_sd_r: 0.084

  # ----

  O1H:                     # O1 held to expiry
    enabled: true          # evidence book: track 14 §7.1 "O1-h: same, short 0.10 delta, held to expiry"
    name: Put credit spread held to expiry (O1-h)
    root: XSP              # cash-settled XSP/SPXW only
    index: "^GSPC"
    settle_scale: 0.1
    signal: o1_filters     # "same filters" as O1
    filters:
      sma_trend: 200
      vix_below: 30.0
      vix_ratio_below: 1.0
    entry_window_dte: [40, 45]
    expiry_dte: [40, 50]
    target_dte: 45
    short_delta: 0.10
    delta_tolerance: 0.05
    width_pct_spot: 0.05
    width_tolerance: 0.01
    take_profit_at: null
    exit_dte: null
    hold_to_expiry: true   # settled at intrinsic value from the S&P 500's official close on the expiry date
    max_open: 2            # the next cycle opens before the last one expires (track 14 §7.4)
    liquidity:
      max_natural_frac_of_credit: 0.10
      min_open_interest: 0

  # ----

  I1:                      # put-spread variant I1 (track 14)
    enabled: true          # incubator: track 14 §4.4, §7.1 (review after >= 20 trades)
    name: Put credit spread after a VIX spike fades (I1)
    root: XSP
    index: "^GSPC"
    settle_scale: 0.1
    signal: vix_fade       # no trend, VIX or term-structure filter (track 14 §7.2 "except I1", §7.5.9)
    trigger:
      vix_peak: 30.0       # VIX closed >= 30 in the last 10 sessions, today included,
      lookback_sessions: 10
      fade_ratio: 0.8      # and today's close is <= 0.8 x that peak
      cooldown_days: 30    # a new signal only more than 30 calendar days after the last
    target_dte: 45         # the last listed expiry at most 45 days out
    expiry_dte: [40, 50]
    short_delta: 0.20
    delta_tolerance: 0.05
    width_pct_spot: 0.05
    width_tolerance: 0.01
    take_profit_at: null
    exit_dte: null
    hold_to_expiry: true
    max_open: 2
    liquidity:
      max_natural_frac_of_credit: 0.10
      min_open_interest: 0

  # ----

  I2:                      # put-spread variant I2 (track 14)
    enabled: true          # incubator: track 14 §7.1 "IBIT put credit spreads (O1 logic)"
    name: IBIT put credit spread (I2)
    root: IBIT
    index: IBIT            # the expiry safety net settles on IBIT's close (the 21-DTE close comes first)
    settle_scale: 1.0
    signal: btc_trend
    filters:               # "O1 filters on BTC": price above its 200-day average, DVOL not in backwardation
      btc_sma_days: 200    # BTC-USD above the average of its last 200 UTC daily closes
      iv_ratio_below: 1.0  # DVOL stand-in, at 10:17 ET: IBIT's ~30-day ATM IV / its ~90-day ATM IV < 1.0
      iv_near_dte: 30
      iv_far_dte: 90
    entry_window_dte: [40, 45]
    expiry_dte: [40, 50]
    target_dte: 45
    short_delta: 0.20
    delta_tolerance: 0.05
    width_pct_spot: 0.05
    width_tolerance: 0.01
    take_profit_at: 0.5
    exit_dte: 21
    hold_to_expiry: false  # American-style, share-settled: never held into expiry (track 14 §6.3)
    max_open: 1
    liquidity:
      max_natural_frac_of_credit: 0.10
      min_open_interest: 500   # ETF options (track 14 §7.2)

  # ----

  ST2:                     # VIX/VIX3M inversion in an uptrend, hold 20 sessions (track 13 §11.3)
    enabled: true          # incubator: promote only if the next >= 15 signals average >= +1.0% excess
    name: VIX/VIX3M inversion in an uptrend (ST-2)
    ticker: SPY
    sma_trend: 200         # SPY's raw close above its 200-day average
    ratio_at_least: 1.0    # VIX/VIX3M closes >= 1.00 ...
    quiet_sessions: 20     # ... for the first time in 20 sessions
    hold_sessions: 20      # bought at the next open, sold at the close of session 20 (track 13 run_rule, hold=20)

  # ----

  ETH:                     # ETH weekly trend switch: M3's rule on ETH (design v3.3 §3 M3, "Shadow ledger"; track 15 R2)
    enabled: true
    weeks: 10              # weekly close (the Sunday UTC candle) above its 10-week average, as M3
    cost_per_side: 0.0025  # track 15 §1.2 crypto base case; fills at the next UTC daily close (track 15's lag)
    max_catchup_weeks: 12  # the daily run replays missed weeks, oldest first, up to this many
    promotion:             # track 15 R2: an alpha source only if 24 months of shadow trades show timing alpha t >= 2
      min_months: 24
      min_t: 2.0
      nw_lags: 4           # Newey-West lags of the weekly regression

  # ----

  M6:                      # crypto structural: depeg buy and cash-and-carry (design v3.3 §3 M6; shadow only, track 20)
    enabled: true
    depeg:                 # the hourly 24/7 job (.github/workflows/hourly.yml); docs/phase-b/crypto.md
      enabled: true
      trigger_price: 0.97  # a regulated, fiat-backed coin <= $0.97 ...
      min_venues: 2        # ... on >= 2 venues, each a two-sided book no wider than max_spread
      max_spread: 0.02
      exit_price: 0.995    # track 05 §11: exit at >= $0.995 ...
      time_stop_days: 30   # ... or after 30 calendar days
      size_pct_nav: 0.03   # <= 3% of NAV; stress = 100% of the position (design §3 M6; red team m7)
      stress_pct: 1.0
      fee_per_side: 0.0025 # track 15 §1.2 crypto base case
      update_step: 0.005   # an open event records a new low only when the median falls half a cent further
      # "Reserves attested" and "redemptions not suspended > 72 h" can't be read mechanically: every event records
      # both as "unverified". Venue symbols checked on 29 Sep 2026 (Coinbase Exchange, Kraken, Gemini public APIs).
      coins:               # regulated, fiat-backed coins -> their USD books
        # Circle. Coinbase has no USDC-USD book (USDC converts 1:1 there): its price is implied via USDT.
        USDC: {coinbase: "USDT-USD/USDT-USDC", kraken: USDCUSD, gemini: usdcusd}
        RLUSD: {kraken: RLUSDUSD, gemini: rlusdusd}   # Standard Custody & Trust (NYDFS)
        PYUSD: {kraken: PYUSDUSD}                     # Paxos Trust (NYDFS); one venue today: can't confirm alone
        USDP: {coinbase: PAX-USD}                     # Paxos Trust (NYDFS); one venue today: can't confirm alone
      watch_only:          # scored like a depeg, never counted: the issuer is not regulated (docs/phase-b/crypto.md)
        USDT: {coinbase: USDT-USD, kraken: USDTZUSD, gemini: usdtusd}
    carry:                 # checked by the 22:17 ET daily run; off today (basis ~5.3% vs T-bills + 6 ~ 10%, design §11)
      enabled: true
      max_days_to_expiry: 60   # CME contracts with <= 60 days to expiry; the month with the most days left is used
      excess_over_tbill: 0.06  # annualised basis >= T-bills + 6 points
      notional_pct_nav: 0.15   # <= 15% notional: long IBIT, short MBT in the same taxable account
      cost_round_trip: 0.0015  # IBIT ~0.05% + MBT ~0.10% round trip (track 15 §4.7)
      ibit_fee_annual: 0.0025  # IBIT's expense ratio over the days held

  # ----

  EDGAR:                   # insider clusters, special dividends, activist 13D, cash mergers, CEF tenders (track 16)
    # Design v3.3 §3 "Shadow ledger", §5 never-list, §10 data table; track 16 §10.2 (SH-1..SH-4) and §10.4 P1;
    # track 05 §3.7 / §11 A (CEF tender capture). No emails, no orders, no LLM. Notes: docs/phase-b/edgar.md.
    enabled: true
    # operations (track 16 P1: screened every night after 22:00 ET; capped so the daily job stays under 2 minutes)
    filings_final_et: "22:00"          # EDGAR accepts filings (Form 4s included) until 22:00 ET
    final_margin_minutes: 5            # a day's filings are final (screened for good) from 22:05 ET
    provisional_before_final: true     # a run before then also screens the day, without marking it done
                                       # (in winter daily.yml's first slot, 02:17 UTC, is 21:17 EST)
    overlap_days: 1                    # the last screened date is searched again, for filings indexed late
    max_catchup_days: 7                # older unscreened dates are dropped, with a data alert
    max_seconds: 90                    # wall-clock budget per run; the rest carries over to the next run
    max_documents: 150                 # filing documents fetched per run
    max_price_lookups: 40              # daily-bar fetches per run (universe checks, entries, exits)
    max_requests_per_second: 8         # SEC fair access: at most 10 a second to *.sec.gov
    seen_keep_days: 7
    void_after_days: 10                # an event with no prices this long after they were due is void (kept)
    short_interest_lag_days: 12        # FINRA short interest counts from settlement + 12 days (track 16 finra_si.py)
    large_cap_min: 2.0e+9              # benchmark SPY at or above, IWM below (track 16 conventions)
    costs:                             # round trip by market cap at the event, track 16 §1.3: [min cap, cost, bucket]
      - [1.0e+10, 0.0015, large]
      - [2.0e+9, 0.003, mid]
      - [3.0e+8, 0.008, small]
      - [5.0e+7, 0.020, micro]
      - [0, 0.040, nano]
    SH1:                               # insider cluster buys (track 16 §3, §10.2): a monitor of a rejected setup
      enabled: true
      prefilter_query: "P"             # EFTS pre-filter for purchase Form 4s (traderec/data/edgar.py)
      prefilter_check_min_filings: 150 # a day this busy with no purchase candidates raises a data alert
      window_days: 30                  # >= 2 directors/officers with open-market purchases within 30 calendar days
      min_insiders: 2
      lockout_days: 90                 # one event per issuer per 90 days
      max_filing_lag_days: 14          # trade to filing (track 16 §3.1)
      warmup_days: 30                  # clusters count once a full window of purchases has been collected
      ticker_tolerance: 0.25           # the close near the trade date within 25% of the insiders' price (§1.5)
      entry: open                      # next session's open after the cluster-completing Form 4
      hold_sessions: 20                # exit at the close of session 20
      universe: {min_price: 5.0, min_mcap: 3.0e+8, min_dvol20: 1.0e+6}
      promotion: {min_trades: 60, min_mean: 0.01, min_t: 2.5, max_reaction_median: 0.01}
      base_rate: {win_rate: 0.42, mean: -0.0106}    # track 16 §2 row 1 (2016-26, 20 sessions, net excess)
    SH2:                               # special dividends (track 16 §4.3, §10.2): incubate, shadow only
      enabled: true
      query: '"special dividend" OR "special cash dividend"'
      min_multiple_of_regular: 1.5     # >= 1.5x the median regular dividend of the prior 2 years (or the first one)
      min_yield: 0.01                  # >= 1% of the price
      ex_date_days: [3, 75]            # ex-date 3-75 calendar days after the 8-K
      regular_lookback_days: 730
      entry: close                     # close of the session after the 8-K; exit at the close before the ex-date
      universe: {min_price: 5.0, min_dvol20: 1.0e+6}
      promotion: {min_trades: 30, min_mean: 0.005, min_t: 2.0}   # and median > 0
      base_rate: {win_rate: 0.52, mean: 0.0038}     # track 16 §2 row 11 (ADV >= $1m, 2016-26)
    SH3:                               # activist Schedule 13D (track 16 §6.5, §10.2): a monitor of a rejected setup
      enabled: true
      forms: "SCHEDULE 13D,SC 13D"     # originals only ("SC 13D" before Dec 2024)
      lockout_days: 90                 # one event per company per 90 days
      entry: close                     # close of the session after the filing
      hold_sessions: 20                # exit at the close of session 20
      universe: {min_mcap: 3.0e+8, min_price: 2.0, min_dvol20: 1.0e+5, min_history: 60}
      promotion: {min_trades: 60, min_mean: 0.01, min_t: 2.5, max_reaction_median: 0.01}   # as SH-1
      base_rate: {win_rate: 0.42, mean: -0.0107}    # track 16 §2 row 5 (known activists, 2016-26)
    SH4:                               # near-completion cash mergers (track 16 §4.1, §10.2): cash substitute, shadow
      enabled: true
      query: '"merger"'
      max_days_to_close: 30            # expected close <= 30 days after the last approval 8-K
      watch_days: 180                  # a definitive proxy stays on the watchlist this long
      lookup_days: 365                 # a vote 8-K looks back this far for the target's proxy
      max_hold_days: 60                # design §1: every trade closes within 60 calendar days
      entry: close                     # close after the last approval 8-K; exit at the deal's close (cash)
      universe: {min_mcap: 3.0e+8}
      promotion: {min_trades: 30, min_excess_annualized: 0.03, max_break_loss_book: 0.02, position_weight: 0.05}
      base_rate: {win_rate: 0.95}      # track 16 §4.1: about 95% of near-close deals complete [unverified there]
    CEF:                               # CEF tender capture (track 05 §3.7, §11 A; red-team v3 m11)
      enabled: true
      query: '"net asset value"'
      min_pct_nav: 0.98                # a self-tender at >= 98% of NAV
      min_discount: 0.08               # while the fund trades >= 8% below NAV
      lockout_days: 120                # one event per fund per offer
      nav_symbol: "X{ticker}X"         # Yahoo's NAV series for a closed-end fund (track 24 §2)
      remainder_sell_sessions: 3       # the shares not accepted are sold at the close 3 sessions after expiry
      max_hold_days: 60                # design §1
      entry: open                      # next open (track 05 gives no timing)
      universe: {min_mcap: 3.0e+8, min_dvol20: 1.0e+6}   # design §5: no event trades under $300m or $1m a day
      promotion: null                  # track 05 pre-registered none; see docs/phase-b/edgar.md
      base_rate: null                  # track 05 §11 A gives +2-6% per event, but no win rate

  # ----

  MACRO:                   # W3 cool-CPI TLT, W4 BoJ, gold spike fade, scheduled-release reactions (track 17)
    # Design v3.3 §3 M5 ("Scheduled releases. Never traded; logged for calibration only") and §3 "Shadow
    # ledger"; track 17 §2, §3.1, §5.2 (W3, W4), §7 (R1, R2, R6, R9, R12). No emails, no orders, no LLM.
    # Runner: traderec/runners/macro_shadows.py. Notes: docs/phase-b/macro-shadows.md.
    enabled: true
    calendar: econ_calendar.yaml   # config/: the official release dates and the owner's list of war onsets
    reverify_days: 60              # alert monthly once the calendar's `verified` date is older than this
    pending_sessions: 3            # a missing input is retried this many sessions, then alerted (fail closed)
    baseline_years: 3              # random-day baseline: the 3 years before entry (track 17 §0.1, §1)
    state_keep_days: 400           # a completed release record leaves state.json 400 days on (the ledger keeps it)
    releases:                      # R1: every scheduled release, logged, never traded
      kinds: [CPI, NFP, FOMC, GDP, PCE, BOJ, ECB]
      assets:                      # the first ticker with data is used; moves on total-return closes
        SPY: [SPY]
        TLT: [TLT]
        GLD: [GLD]
        USO: [USO]
        USD: [UUP, DX-Y.NYB]       # UUP, else the ICE dollar index
        BTC: [BTC-USD]             # the provider's BTC-USD close per UTC day (M3's source)
      yields: [2Y, 10Y]            # Treasury par yield curve (FRED DGS2 / DGS10 as fallback); changes in bp
      forward_sessions: [1, 5, 20] # from the day-0 close (track 17 §0.1; R1 "forward moves at 1, 5 and 20 days")
      buckets_bp:                  # the 2-year's day-0 move, track 17's surprise proxy (§2.1-2.2)
        FOMC: {hawkish: 5, dovish: -7}
        CPI: {hawkish: 4, dovish: -6}
        NFP: {hawkish: 8, dovish: -6}
    W3:                            # cool CPI -> TLT (§5.2 W3). Paper only: it fails BH-FDR (§2.3)
      enabled: true
      ticker: TLT                  # the track's TLT call spread needs option chains we lack: shares instead
      d2y_max_bp: -6               # the 2-year falls 6bp or more on the CPI day ...
      core_cpi_mm_max: 0.1         # ... and core CPI m/m, as published (one decimal), is 0.1% or less
      hold_sessions: 20            # R6; the time stop sells at the open of session 21
      invalidation: true           # exit at the open after the 10-year closes above its pre-CPI close
      yield_tolerance_bp: 2        # Treasury vs FRED on a trigger input: a larger gap fails closed
      forecast_p_profit: 0.55      # R9 shrink, kappa 0.25: 0.51 + 0.25 x (0.67 - 0.51) (TLT up over 20 days)
      base_rates: {n: 43, mean_f20_pct: 1.39, up_pct: 67, baseline_f20_pct: 0.33}   # §5.2 W3 "History"
      promotion: {min_instances: 24, min_t: 2.0, fdr_q: 0.10}   # R1: >= 24 paper instances, t >= 2 net of costs,
                                                                # and BH-FDR 10% with the rules tested alongside
    W4:                            # BoJ hikes and the Fed holds (§5.2 W4, the BoJ sub-setup; paper; no edge claimed)
      enabled: true
      ticker: FXY                  # "FXY outright"; FXY options fail liquidity (§4.5)
      fed_pair_max_days: 10        # the Fed decision paired with a BoJ decision: the nearest within 10 days
      boj_window_days: 10          # the BoJ's rate file changes on the effective date, 1-4 business days later
      max_wait_days: 14            # a decision still unconfirmed this long after the pair is alerted
      stop_usdjpy: 0.015           # stop at USDJPY +1.5% from entry: FXY closes at or below entry / 1.015
      target_usdjpy: -0.04         # target at USDJPY -4%: FXY closes at or above entry / 0.96
      hold_sessions: 20            # "20-day time stop"
      forecast_p_profit: 0.5       # n = 1 analog: the base rate
      base_rates: {n: 1, analog: "2024-07-31", usdjpy_f20_pct: -5.7, all_hikes_n: 7, all_hikes_usdjpy_f20_pct: -1.4}
      promotion: {min_instances: 24, min_t: 2.0, fdr_q: 0.10}   # R1, as W3
    GOLD_FADE:                     # fade gold's day-0 war spike (§3.1: reversed the next day in 8 of 8 war onsets)
      enabled: true
      ticker: GLD
      hold_sessions: 1             # short at the open after day 0, cover at the next open
      near_miss_move: 0.02         # a GLD day of +2% or more with no onset listed is logged for review
      forecast_p_profit: 0.6       # R9 shrink, kappa 0.25: 0.47 + 0.25 x (1.00 - 0.47) (GLD down the next day)
      base_rates: {n: 8, day0_pct: 1.54, mean_f1_pct: -1.24, up: 0}   # §3.1 "War subset / gold"
      promotion: {min_instances: 10}   # R2: "paper only until n >= 10"

risk:
  governor:
    full_until: 0.05
    floor_at: 0.15
    floor: 0.25
    review_at: 0.15
    pause_discretionary_at: 0.20
  caps:
    per_trade_stress: 0.02
    us_equity_cluster: 0.07          # 3% M2 legs + 4% reserved for M1 / W10 / M4
    total_open_stress: 0.10
  trade_budget_per_year: 100
  max_open_positions: 8
  stress_floor: 0.15                 # minimum 10-session stress assumed for any ETF
  crypto_stress: 0.45                # IBIT stress (BTC worst 10-session loss scale)

fills:                                # fill model v1.0 (frozen for the paper phase)
  model_version: "1.0"
  slippage_bps:
    default: 3
    SPY: 1
    QQQ: 1
    IEF: 2
    GLD: 2
    IBIT: 3
    USO: 8
    FXE: 8
    FXY: 8
    FXA: 8
  options:                            # two-leg spreads (Phase B, design v3.3 §7): P = combo mid +/- concession x natural width
    concession: 0.3                   # = mid + 0.6 x half-spread per leg (track 18 §5.1); fills only within the order's limit
    max_concession: 0.5               # the stated maximum (open) / minimum (close) for the one re-price: the natural price
    multiplier: 100                   # shares per contract

# ---- Phase B options settings (docs/PHASE_B_CONTRACTS.md §1-§5; design v3.3 §3a, §4, §7, §10). ----
options:
  enabled: true                       # the 10:17 ET options job (python -m traderec options; .github/workflows/options.yml)
  preferred_root: XSP                 # design §3a.4: XSP preferred (cash-settled, European, Section 1256)
  min_entry_dte: 40                   # design §4 and §5: no option with < 40 DTE at entry (contract §2)
  close_sessions_before_expiry: 1     # design §3a.4: close >= 1 trading day before expiration (modules apply it)
  snapshot_window_et: ["10:15", "16:00"]   # fills use only quotes stamped in this window on the run date (design §7:
                                      # a market-hours snapshot; CBOE's quotes lag ~15 min, so 10:15 = quotes from 10:00)
  close_after_et: "16:00"             # the daily run marks spreads only with chains stamped at or after the close
  liquidity:                          # design §4 "Option liquidity" (track 17 R8), measured on the market-hours snapshot
    max_leg_spread_frac: 0.10         # each leg: ask - bid <= 10% of its mid ...
    min_open_interest: 500            # ... with open interest >= 500
    max_round_trip_frac: 0.10         # the structure: round trip (its natural width) <= 10% of the debit ...
    max_round_trip_frac_high_gain: 0.20   # ... or <= 20% when the expected gain is >= 2x the round-trip cost
    high_gain_cost_multiple: 2.0
  snapshots:                          # state/options/<date>/<root>-<HHMM>.csv.gz (contract §5)
    max_bytes_per_day: 100000         # all roots and runs of a day; the book's legs are always kept
    min_dte: 20                       # surface sample for the runners' roots: expiries 20-120 days out ...
    max_dte: 120
    max_expiries: 12                  # ... at most one a week, spread evenly ...
    moneyness: 0.25                   # ... strikes within +/-25% of spot ...
    strike_step: 0.025                # ... the listed strike nearest each 2.5% of spot

data:
  two_source_tolerance: 0.001         # 0.1% close mismatch blocks new signals
  fallback_tbill_rate: 0.04

# ---- Design v4.0 (research/00-SYSTEM-DESIGN-v4.md Appendix A.1): the growth book. Phase C1 build. ----
# Paper mode until the §7 gates pass; account.yaml sets paper/live. The module status changes are the `status` keys
# on the module blocks above (active | shadow | retired | "superseded_by: G2"); Phase C1 enforces only M3's, in the
# weekly job. Keys beyond A.1 are marked "C1:".
growth:
  enabled: true                    # paper mode until the s7 gates pass; account.yaml sets paper/live
  drawdown_limit: 0.40             # D: 0.30 / 0.40 / 0.50 (decision 1)
  governor:                        # derived from D unless overridden: full_until = D - 0.25, floor_at = D - 0.05
    full_until: 0.15
    floor: 0.25
    floor_at: 0.35
    reset: weekly                  # re-set on the Sunday run only
    min_step: 0.10                 # re-size only when G moved >= 0.10 since the last order
  hard_stop:
    at: 0.40                       # = drawdown_limit
    action: all_to_sgov_and_pause  # paper mode + owner review before restart
  sleeves:
    G1:
      legs:
        SSO: {weight: 0.25, index: "^GSPC"}
        QLD: {weight: 0.25, index: "^NDX"}
      signal: {sma_days: 200, band: 0.02, decision: friday_close, execution: monday_open}
      out: SGOV
      kill: {tracking_20d_max_pts: 3.0}
    G2:
      instrument: IBIT
      backup: FBTC
      weight: 0.30
      max_weight: 0.50             # decision 2 ceiling
      signal: {weekly_ma_weeks: 10, sma_days: 200, decision: sunday_utc_close, execution: monday_open,
               two_source_tolerance: 0.02}    # C1: Bitcoin venue closes differ by more than the 0.1% ETF tolerance.
                                              # C3 replay: Coinbase vs Yahoo at 00:00 UTC on 509 Sundays 2017-2026:
                                              # 0.5% failed 20% of them (68% in 2017), 2% fails 2.6% (none since 2020)
                                              # and still catches a wrong print (docs/phase-c/replay.md)
      out: SGOV
      vol_cut: {realized_60d_vol_gt: 0.70, quarters: 1, factor: 0.667, restore_below: 0.60}
    G3:
      reserve_weight: 0.15
      out: SGOV
      rules:
        # Phase C4a (docs/phase-c/growth.md §11): each rule's universe, the owner-maintained figures and its promotion
        # test (track 35 §6). A rule trades the reserve only after the owner sets `status: live`; until then it runs on
        # paper (the daily run's shadow book) and the Sunday email shows its tally. Keys beyond A.1 are marked "C4a:".
        cef_crash_discount:
          status: shadow             # shadow | live: the owner's edit, after the promotion test passes (never automatic)
          slots: 2
          slot_weight: 0.05
          z: 2.5
          lookback: 252
          hold_days: 60
          leverage_max: 0.35
          price_min: 5
          adv_min_usd: 1000000
          crash_mode_triggers: 10
          crash_mode_weeks: 3
          label: "CEF crash-discount rule"   # C4a: the name the emails and reviews use
          nav_symbol: "X{ticker}X"   # C4a: Yahoo's NAV series, as the EDGAR CEF screen reads it
          min_observations: 200      # C4a: the rolling statistics need 200 discount prints in the 252 sessions (the reference script)
          horizon_sessions: 60       # C4a: the scoring horizon of the random-entry baseline
          baseline_min_windows: 100  # C4a: the baseline needs this many complete 60-session windows before the entry
          promotion: {min_trades: 30, min_mean_excess: 0.015}   # C4a: track 35 §6 G2, plus a positive median excess in both halves
          # C4a: track 35 §3.3's 20 funds less ADX and TY (no Yahoo NAV symbol). A ticker off config/whitelist.yaml is
          # screened on paper but never bought: run check_venues.py and list it before setting the rule live.
          universe: [PCN, PTY, PDI, PHK, GAB, CII, UTG, BST, ETV, NFJ, EOS, RQI, RNP, USA, GAM, BDJ, EVT, PEO]
          # C4a: each fund's leverage (a fraction of its total managed assets: effective or total leverage as the
          # sponsor's fund page states it), the date it was read and its source. A fund with `null` fails closed
          # ("leverage unknown") until the owner fills it (docs/OPERATIONS.md §1). On 29 Sep 2026 one fetch of each
          # sponsor's fund page was attempted from the build sandbox; only Virtus's NFJ page gave a figure (the PIMCO,
          # Gabelli and BlackRock pages were not found at the addresses tried; the Eaton Vance, Cohen & Steers and
          # Grayscale sites refused the request; the others render their figures in scripts).
          funds:
            PCN: {leverage: null, as_of: null, source: "unverified; owner to fill (PIMCO fund page, effective leverage)"}
            PTY: {leverage: null, as_of: null, source: "unverified; owner to fill (PIMCO fund page, effective leverage)"}
            PDI: {leverage: null, as_of: null, source: "unverified; owner to fill (PIMCO fund page, effective leverage)"}
            PHK: {leverage: null, as_of: null, source: "unverified; owner to fill (PIMCO fund page, effective leverage)"}
            GAB: {leverage: null, as_of: null, source: "unverified; owner to fill (Gabelli fund page, preferred stock as a share of assets)"}
            CII: {leverage: null, as_of: null, source: "unverified; owner to fill (BlackRock fund page, effective leverage)"}
            UTG: {leverage: null, as_of: null, source: "unverified; owner to fill (Reaves fund page, leverage ratio)"}
            BST: {leverage: null, as_of: null, source: "unverified; owner to fill (BlackRock fund page, effective leverage)"}
            ETV: {leverage: null, as_of: null, source: "unverified; owner to fill (Eaton Vance fund page, leverage)"}
            NFJ: {leverage: 0.0, as_of: "2026-08-31", source: "Virtus fund page, leverage section: total effective leverage 0.00% as of 08/31/2026 (read 2026-09-29)"}
            EOS: {leverage: null, as_of: null, source: "unverified; owner to fill (Eaton Vance fund page, leverage)"}
            RQI: {leverage: null, as_of: null, source: "unverified; owner to fill (Cohen & Steers fund page, leverage)"}
            RNP: {leverage: null, as_of: null, source: "unverified; owner to fill (Cohen & Steers fund page, leverage)"}
            USA: {leverage: null, as_of: null, source: "unverified; owner to fill (Liberty All-Star fund page, leverage)"}
            GAM: {leverage: null, as_of: null, source: "unverified; owner to fill (General American Investors site, preferred stock as a share of assets)"}
            BDJ: {leverage: null, as_of: null, source: "unverified; owner to fill (BlackRock fund page, effective leverage)"}
