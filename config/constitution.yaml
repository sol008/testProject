# Strategy constitution v3.3 (research/00-SYSTEM-DESIGN-v3.md). Changing anything here is a
# rule change: see design section 8 (at most one change per parameter per quarter, with evidence).
# v3.3 (decision 12): W10 becomes a policy module with a 90-day exception; every other rule keeps 60 days.
version: "3.3.0"

holding:
  max_calendar_days: 60          # every trade closes within 60 calendar days (decision 1)
  exceptions:                    # decision 12: holds to the last session within 90 calendar days
    W10: 90
    M4: 90                       # Phase B
  continuing: [M2, M3]           # re-decided monthly / weekly; may continue (decisions 5 and 11)

modules:
  M1:                      # ST-1: VIX-gated uptrend dip-buy (policy module), track 13 §11.1
    enabled: true
    name: Uptrend dip-buy
    ticker: SPY
    account: ira
    notional_pct_nav: 0.06
    sma_trend: 200
    rsi_period: 2
    rsi_below: 10
    vix_min: 20.0
    exit_sma: 5
    max_sessions: 20       # time stop: sell at the open of session 21
    stress_loss: 0.326     # S&P 500 worst 10-session loss (track 13 §3.4)
    base_rates:            # track 13, out-of-sample 2008-2026
      trades_per_year: 3.8
      win_rate: 0.82
      mean_pct: 0.88
      planning_mean_pct: 0.43
      median_hold_sessions: 3
      worst_pct: -9.4
      max_drawdown_pct: -14
    forecasts:             # pre-registered, scored monthly
      p_profit: 0.75       # shrunk from 0.82
      p_time_stop: 0.10

  M2:                      # R1: slow multi-asset trend, long-only ETF8 in the IRA, track 15 R1
    enabled: true
    name: Trend book
    account: ira
    legs:
      SPY: us_equity
      QQQ: us_equity
      IEF: duration
      GLD: gold
      USO: oil
      FXE: usd
      FXY: usd
      FXA: usd
    lookback_sessions: 252
    vol_target_per_leg: 0.035
    ewma_span: 60
    scale: 0.5
    long_only: true
    gross_cap_pct_nav: 0.60
    single_leg_cap_pct_nav: 0.25
    us_equity_stress_cap_pct_nav: 0.03
    sleeve_stress_pct_nav: 0.045     # worst historical book month at s = 0.5 (track 15)
    band_rel: 0.25
    band_abs_usd: 300
    max_orders_per_email: 3
    contango_veto_roll_yield: -0.20  # R3: no long crude leg in steep contango (checked when data is available)
    forecasts:
      p_leg_up_next_month: 0.54

  M3:                      # R2: Bitcoin weekly trend switch (policy module, opt-in sleeve), track 15 R2
    enabled: true
    name: Bitcoin trend switch
    ticker: IBIT
    account: ira
    sleeve_pct_nav: 0.03
    weeks: 10
    forecasts:
      p_profit: 0.45

  W10:                     # uptrend crash-day buy: policy module with a 90-day exception (design v3.3 §3, track 23)
    enabled: true
    name: Uptrend crash-day buy
    ticker: SPY
    index: "^GSPC"
    account: ira
    drop_pct: -0.03          # S&P close 3.00% or more below the prior close (unrounded)
    sma_trend: 200           # prior close above its 200-day average, computed through the prior close
    decluster_sessions: 20   # no other -3% close in the prior 20 sessions
    notional_pct_nav: 0.06   # x G(D); 6.7% would breach the 2% per-trade stress cap
    stress_loss: 0.326       # S&P 500 worst 10-session loss (as M1)
    horizon_stress_loss: 0.481   # worst 90-day window: the planning worst case shown in emails
    max_calendar_days: 90    # sell at the open of the last session within 90 calendar days of entry
    cluster_min_fraction: 0.5    # skip when the US-equity reserve leaves less than half the size
    kill_switch:
      single_trade_loss: -0.15   # one trade losing 15% or more sends W10 back to shadow
      cumulative_pnl_pct_nav: -0.015
    base_rates:              # track 23, SPY 1993-2026, calendar-exact 90 days, one position at a time
      since: 1993
      trades_per_year: 0.5
      win_rate: 0.88
      mean_pct: 7.2
      placebo_mean_pct: 2.7
      planning_mean_pct: 3.6
      worst_pct: -8.3
      worst_interim_pct: -31
      worst_interim_when: March 2020
      edge_since: 1990       # no edge before 1990 (1928-89: p 0.44)
    forecasts:
      p_profit: 0.72         # shrunk from 0.88 (1928-2026: 0.72)

  # ---- Phase B (design v3.3 §10; docs/PHASE_B_CONTRACTS.md §10). Each block is completed by its build. ----

  M4:                      # O2 crash call debit spread: policy module, 90-day exception (design v3.3 §3 M4)
    enabled: false

  # ----

  W8:                      # de-escalation confirmed: policy module, small (design v3.3 §3 M5)
    enabled: false

  # ----

  W9:                      # escalation that removes barrels: paper (design v3.3 §3 M5)
    enabled: false

shadow:                    # logged automatically, never emailed
  ST1B:
    enabled: true          # M1 without the VIX gate
  W10:
    enabled: true          # every uptrend -3% day, scored at 60 and 90 calendar days (W10's annual-review record)
    score_calendar_days: [60, 90]

  # ---- Phase B shadow books (design v3.3 §3 "Shadow ledger"). Each block is completed by its build. ----

  M4_TWIN:                 # M4's 60-DTE paper twin
    enabled: false

  # ----

  O1:                      # M7: trend-filtered put credit spread (shadow at the $100k paper size)
    enabled: true          # design v3.3 §3 M7, §6; track 14 §3.2-§3.3, §7.1-§7.6. Paper only from ≈$162k
    name: Trend-filtered put credit spread (M7)
    root: XSP              # XSP/SPXW (design §3 M7); XSP is the size that fits below ≈$1.1M (track 14 §6.1)
    index: "^GSPC"         # the trend filter and the settlement use the S&P 500's official close
    settle_scale: 0.1      # XSP settles on the S&P 500 close / 10
    signal: o1_filters
    filters:               # design §3 M7 "Filters" (track 14 §7.2), at the close before the entry
      sma_trend: 200       # S&P 500 close above its 200-day average
      vix_below: 30.0      # VIX < 30
      vix_ratio_below: 1.0 # VIX/VIX3M < 1.0
    entry_window_dte: [40, 45]   # one entry per monthly (third-Friday) cycle, from 45 DTE (the tested entry,
                                 # track 14 §3.2) down to 40 (design: 40-50 DTE; never below 40)
    expiry_dte: [40, 50]   # when the monthly is not listed, the listed expiry nearest it in this range
    target_dte: 45
    short_delta: 0.20      # sell the 0.20-delta put (0.15-0.25, track 14 §7.1)
    delta_tolerance: 0.05
    width_pct_spot: 0.05   # buy the put 5% of spot lower (4-6%)
    width_tolerance: 0.01
    take_profit_at: 0.5    # buy back when that costs <= 50% of the credit, checked at each 10:17 ET snapshot
    exit_dte: 21           # otherwise close at the first 10:17 ET snapshot with <= 21 days to expiry; no stop
    hold_to_expiry: false
    max_open: 1
    liquidity:             # track 14 §7.2: natural combo spread <= 10% of the mid credit; the spread test
      max_natural_frac_of_credit: 0.10   # governs for index options (market-maker quoted strikes)
      min_open_interest: 0
    size:                  # design §3 M7: 2% of NAV at max loss (3% cap): one XSP spread needs ≈$162k
      max_loss_pct_nav: 0.02
    promotion:             # track 14 §7.6: >= 24 paper trades (or 30 months), mean R >= model - 2 SE
      min_trades: 24
      max_months: 30
      model_mean_r: 0.02
      model_sd_r: 0.084

  # ----

  O1H:                     # O1 held to expiry
    enabled: true          # evidence book: track 14 §7.1 "O1-h: same, short 0.10 delta, held to expiry"
    name: Put credit spread held to expiry (O1-h)
    root: XSP              # cash-settled XSP/SPXW only
    index: "^GSPC"
    settle_scale: 0.1
    signal: o1_filters     # "same filters" as O1
    filters:
      sma_trend: 200
      vix_below: 30.0
      vix_ratio_below: 1.0
    entry_window_dte: [40, 45]
    expiry_dte: [40, 50]
    target_dte: 45
    short_delta: 0.10
    delta_tolerance: 0.05
    width_pct_spot: 0.05
    width_tolerance: 0.01
    take_profit_at: null
    exit_dte: null
    hold_to_expiry: true   # settled at intrinsic value from the S&P 500's official close on the expiry date
    max_open: 2            # the next cycle opens before the last one expires (track 14 §7.4)
    liquidity:
      max_natural_frac_of_credit: 0.10
      min_open_interest: 0

  # ----

  I1:                      # put-spread variant I1 (track 14)
    enabled: true          # incubator: track 14 §4.4, §7.1 (review after >= 20 trades)
    name: Put credit spread after a VIX spike fades (I1)
    root: XSP
    index: "^GSPC"
    settle_scale: 0.1
    signal: vix_fade       # no trend, VIX or term-structure filter (track 14 §7.2 "except I1", §7.5.9)
    trigger:
      vix_peak: 30.0       # VIX closed >= 30 in the last 10 sessions, today included,
      lookback_sessions: 10
      fade_ratio: 0.8      # and today's close is <= 0.8 x that peak
      cooldown_days: 30    # a new signal only more than 30 calendar days after the last
    target_dte: 45         # the last listed expiry at most 45 days out
    expiry_dte: [40, 50]
    short_delta: 0.20
    delta_tolerance: 0.05
    width_pct_spot: 0.05
    width_tolerance: 0.01
    take_profit_at: null
    exit_dte: null
    hold_to_expiry: true
    max_open: 2
    liquidity:
      max_natural_frac_of_credit: 0.10
      min_open_interest: 0

  # ----

  I2:                      # put-spread variant I2 (track 14)
    enabled: true          # incubator: track 14 §7.1 "IBIT put credit spreads (O1 logic)"
    name: IBIT put credit spread (I2)
    root: IBIT
    index: IBIT            # the expiry safety net settles on IBIT's close (the 21-DTE close comes first)
    settle_scale: 1.0
    signal: btc_trend
    filters:               # "O1 filters on BTC": price above its 200-day average, DVOL not in backwardation
      btc_sma_days: 200    # BTC-USD above the average of its last 200 UTC daily closes
      iv_ratio_below: 1.0  # DVOL stand-in, at 10:17 ET: IBIT's ~30-day ATM IV / its ~90-day ATM IV < 1.0
      iv_near_dte: 30
      iv_far_dte: 90
    entry_window_dte: [40, 45]
    expiry_dte: [40, 50]
    target_dte: 45
    short_delta: 0.20
    delta_tolerance: 0.05
    width_pct_spot: 0.05
    width_tolerance: 0.01
    take_profit_at: 0.5
    exit_dte: 21
    hold_to_expiry: false  # American-style, share-settled: never held into expiry (track 14 §6.3)
    max_open: 1
    liquidity:
      max_natural_frac_of_credit: 0.10
      min_open_interest: 500   # ETF options (track 14 §7.2)

  # ----

  ST2:                     # VIX/VIX3M inversion in an uptrend, hold 20 sessions (track 13 §11.3)
    enabled: true          # incubator: promote only if the next >= 15 signals average >= +1.0% excess
    name: VIX/VIX3M inversion in an uptrend (ST-2)
    ticker: SPY
    sma_trend: 200         # SPY's raw close above its 200-day average
    ratio_at_least: 1.0    # VIX/VIX3M closes >= 1.00 ...
    quiet_sessions: 20     # ... for the first time in 20 sessions
    hold_sessions: 20      # bought at the next open, sold at the close of session 20 (track 13 run_rule, hold=20)

  # ----

  ETH:                     # ETH weekly trend switch: M3's rule on ETH (design v3.3 §3 M3, "Shadow ledger"; track 15 R2)
    enabled: true
    weeks: 10              # weekly close (the Sunday UTC candle) above its 10-week average, as M3
    cost_per_side: 0.0025  # track 15 §1.2 crypto base case; fills at the next UTC daily close (track 15's lag)
    max_catchup_weeks: 12  # the daily run replays missed weeks, oldest first, up to this many
    promotion:             # track 15 R2: an alpha source only if 24 months of shadow trades show timing alpha t >= 2
      min_months: 24
      min_t: 2.0
      nw_lags: 4           # Newey-West lags of the weekly regression

  # ----

  M6:                      # crypto structural: depeg buy and cash-and-carry (design v3.3 §3 M6; shadow only, track 20)
    enabled: true
    depeg:                 # the hourly 24/7 job (.github/workflows/hourly.yml); docs/phase-b/crypto.md
      enabled: true
      trigger_price: 0.97  # a regulated, fiat-backed coin <= $0.97 ...
      min_venues: 2        # ... on >= 2 venues, each a two-sided book no wider than max_spread
      max_spread: 0.02
      exit_price: 0.995    # track 05 §11: exit at >= $0.995 ...
      time_stop_days: 30   # ... or after 30 calendar days
      size_pct_nav: 0.03   # <= 3% of NAV; stress = 100% of the position (design §3 M6; red team m7)
      stress_pct: 1.0
      fee_per_side: 0.0025 # track 15 §1.2 crypto base case
      update_step: 0.005   # an open event records a new low only when the median falls half a cent further
      # "Reserves attested" and "redemptions not suspended > 72 h" can't be read mechanically: every event records
      # both as "unverified". Venue symbols checked on 29 Sep 2026 (Coinbase Exchange, Kraken, Gemini public APIs).
      coins:               # regulated, fiat-backed coins -> their USD books
        # Circle. Coinbase has no USDC-USD book (USDC converts 1:1 there): its price is implied via USDT.
        USDC: {coinbase: "USDT-USD/USDT-USDC", kraken: USDCUSD, gemini: usdcusd}
        RLUSD: {kraken: RLUSDUSD, gemini: rlusdusd}   # Standard Custody & Trust (NYDFS)
        PYUSD: {kraken: PYUSDUSD}                     # Paxos Trust (NYDFS); one venue today: can't confirm alone
        USDP: {coinbase: PAX-USD}                     # Paxos Trust (NYDFS); one venue today: can't confirm alone
      watch_only:          # scored like a depeg, never counted: the issuer is not regulated (docs/phase-b/crypto.md)
        USDT: {coinbase: USDT-USD, kraken: USDTZUSD, gemini: usdtusd}
    carry:                 # checked by the 22:17 ET daily run; off today (basis ~5.3% vs T-bills + 6 ~ 10%, design §11)
      enabled: true
      max_days_to_expiry: 60   # CME contracts with <= 60 days to expiry; the month with the most days left is used
      excess_over_tbill: 0.06  # annualised basis >= T-bills + 6 points
      notional_pct_nav: 0.15   # <= 15% notional: long IBIT, short MBT in the same taxable account
      cost_round_trip: 0.0015  # IBIT ~0.05% + MBT ~0.10% round trip (track 15 §4.7)
      ibit_fee_annual: 0.0025  # IBIT's expense ratio over the days held

  # ----

  EDGAR:                   # insider clusters, special dividends, activist 13D, cash mergers, CEF tenders (track 16)
    enabled: false

  # ----

  MACRO:                   # W3 cool-CPI TLT, W4 BoJ, gold spike fade, scheduled-release reactions (track 17)
    enabled: false

risk:
  governor:
    full_until: 0.05
    floor_at: 0.15
    floor: 0.25
    review_at: 0.15
    pause_discretionary_at: 0.20
  caps:
    per_trade_stress: 0.02
    us_equity_cluster: 0.07          # 3% M2 legs + 4% reserved for M1 / W10 / M4
    total_open_stress: 0.10
  trade_budget_per_year: 100
  max_open_positions: 8
  stress_floor: 0.15                 # minimum 10-session stress assumed for any ETF
  crypto_stress: 0.45                # IBIT stress (BTC worst 10-session loss scale)

fills:                                # fill model v1.0 (frozen for the paper phase)
  model_version: "1.0"
  slippage_bps:
    default: 3
    SPY: 1
    QQQ: 1
    IEF: 2
    GLD: 2
    IBIT: 3
    USO: 8
    FXE: 8
    FXY: 8
    FXA: 8
  options:                            # two-leg spreads (Phase B, design v3.3 §7): P = combo mid +/- concession x natural width
    concession: 0.3                   # = mid + 0.6 x half-spread per leg (track 18 §5.1); fills only within the order's limit
    max_concession: 0.5               # the stated maximum (open) / minimum (close) for the one re-price: the natural price
    multiplier: 100                   # shares per contract

# ---- Phase B options settings (docs/PHASE_B_CONTRACTS.md §1-§5; design v3.3 §3a, §4, §7, §10). ----
options:
  enabled: true                       # the 10:17 ET options job (python -m traderec options; .github/workflows/options.yml)
  preferred_root: XSP                 # design §3a.4: XSP preferred (cash-settled, European, Section 1256)
  min_entry_dte: 40                   # design §4 and §5: no option with < 40 DTE at entry (contract §2)
  close_sessions_before_expiry: 1     # design §3a.4: close >= 1 trading day before expiration (modules apply it)
  snapshot_window_et: ["10:15", "16:00"]   # fills use only quotes stamped in this window on the run date (design §7:
                                      # a market-hours snapshot; CBOE's quotes lag ~15 min, so 10:15 = quotes from 10:00)
  close_after_et: "16:00"             # the daily run marks spreads only with chains stamped at or after the close
  liquidity:                          # design §4 "Option liquidity" (track 17 R8), measured on the market-hours snapshot
    max_leg_spread_frac: 0.10         # each leg: ask - bid <= 10% of its mid ...
    min_open_interest: 500            # ... with open interest >= 500
    max_round_trip_frac: 0.10         # the structure: round trip (its natural width) <= 10% of the debit ...
    max_round_trip_frac_high_gain: 0.20   # ... or <= 20% when the expected gain is >= 2x the round-trip cost
    high_gain_cost_multiple: 2.0
  snapshots:                          # state/options/<date>/<root>-<HHMM>.csv.gz (contract §5)
    max_bytes_per_day: 100000         # all roots and runs of a day; the book's legs are always kept
    min_dte: 20                       # surface sample for the runners' roots: expiries 20-120 days out ...
    max_dte: 120
    max_expiries: 12                  # ... at most one a week, spread evenly ...
    moneyness: 0.25                   # ... strikes within +/-25% of spot ...
    strike_step: 0.025                # ... the listed strike nearest each 2.5% of spot

data:
  two_source_tolerance: 0.001         # 0.1% close mismatch blocks new signals
  fallback_tbill_rate: 0.04
