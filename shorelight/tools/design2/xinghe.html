<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>沈星河 — 角色設計 v2</title>
<style>
  :root { --ink:#231c1a; --paper:#f5f0e6; }
  html,body { margin:0; background:#d9d0c1; font-family:"WenQuanYi Zen Hei","Noto Sans CJK TC",sans-serif; color:var(--ink); }
  #sheet { width: 2472px; padding: 0 0 12px; }
  .sheet-head { display:flex; align-items:flex-end; gap:28px; padding:22px 24px 14px; background:#231c1a; color:#f3ead9; }
  .sheet-head h1 { margin:0; font-size:46px; letter-spacing:6px; font-weight:bold; }
  .sheet-head .sub { font-size:14px; color:#d9b878; letter-spacing:1px; margin-top:4px; }
  .sheet-head .brief { font-size:13px; line-height:1.65; color:#e3d8c4; max-width:1150px; }
  .lineup { background:#ece5d7; margin:0; padding:6px 24px 4px; display:flex; align-items:flex-end; gap:6px; border-bottom:2px solid #231c1a; }
  .lineup .lab { font-size:11px; color:#5a4c44; width:150px; line-height:1.4; align-self:center; }
  .grid { display:grid; grid-template-columns:repeat(5,480px); gap:12px; padding:12px; }
  .card { width:480px; height:900px; background:var(--paper); box-shadow:0 0 0 1.5px #231c1a, 0 3px 10px rgba(0,0,0,.25); overflow:hidden; position:relative; }
  .card header { height:56px; display:flex; align-items:center; gap:10px; padding:0 10px; background:#231c1a; color:#f6eedf; box-sizing:border-box; }
  .card .num { font-size:30px; font-weight:bold; color:#e9c27a; font-family:"Inter Display","Inter",sans-serif; width:44px; text-align:center; }
  .card .names { flex:1; min-width:0; }
  .card h2 { margin:0; font-size:21px; letter-spacing:2px; }
  .card h3 { margin:1px 0 0; font-size:11px; font-weight:normal; color:#cdbfa8; letter-spacing:.5px; font-family:"Inter",sans-serif; }
  .card .tag { font-size:11px; padding:4px 7px; border-radius:3px; color:#fff; text-align:center; line-height:1.2; border:1px solid rgba(255,255,255,.35); }
  .card .tag small { display:block; font-size:8.5px; opacity:.85; font-family:"Inter",sans-serif; letter-spacing:.5px; }
  .card canvas { display:block; }
  .pal { height:50px; display:flex; border-top:1px solid #231c1a; border-bottom:1px solid #231c1a; background:#fbf8f1; }
  .sw { flex:1; display:flex; flex-direction:column; padding:4px 4px 0; min-width:0; border-right:1px solid #e0d6c6; }
  .sw:last-child { border-right:none; }
  .sw i { display:block; height:17px; border-radius:2px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.25); }
  .sw b { font-size:10px; margin-top:3px; white-space:nowrap; overflow:hidden; }
  .sw span { font-size:8px; color:#7a6a5e; white-space:nowrap; overflow:hidden; font-family:"Inter",sans-serif; }
  .row { display:flex; height:200px; gap:16px; border-bottom:1px solid #231c1a; background:#ece5d7; }
  .row canvas:first-child { border-right:1px solid #231c1a; }
  .txt { padding:6px 10px 0; font-size:10.8px; line-height:1.48; }
  .txt p { margin:0 0 3px; }
  .txt b { display:inline-block; font-size:10px; color:#fff; background:#5a4636; padding:0 4px; margin-right:5px; border-radius:2px; line-height:1.5; }
  .txt .idea b { background:#8c2f22; }
  .txt .m3d { color:#4f4540; }
  .txt .m3d b { background:#3d566b; }
  body.single { background:#d9d0c1; }
  body.single #sheet { width:auto; padding:0; }
  body.single .grid { display:flex; gap:12px; padding:0; }
</style>
</head>
<body>
<div id="sheet"></div>
<script src="xinghe_lib.js"></script>
<script src="xinghe_designs_a.js"></script>
<script src="xinghe_designs_a2.js"></script>
<script src="xinghe_designs_a3.js"></script>
<script src="xinghe_designs_b.js"></script>
<script src="xinghe_card.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const dpr = parseFloat(q.get('dpr') || '1');
  const only = q.get('opt');
  await document.fonts.ready;
  const D = window.XINGHE_DESIGNS.slice().sort((a, b) => a.id.localeCompare(b.id));
  const sheet = document.getElementById('sheet');
  if (only) {
    document.body.classList.add('single');
    const grid = document.createElement('div'); grid.className = 'grid'; sheet.appendChild(grid);
    D.filter((d) => only.split(',').includes(d.id)).forEach((d) => grid.appendChild(renderCard(d, dpr)));
  } else {
    sheet.innerHTML = `<div class="sheet-head"><div><h1>沈星河</h1><div class="sub">SHEN XINGHE · 主角 protagonist · 18 · 火</div></div>
      <div class="brief">九份「陳記燈籠舖」學徒，八斗子中元夜水燈裡撿到的孩子。開朗、愛偷懶、嘴快心軟，說大話怕小事，關鍵時刻最勇敢；
      靠白芷借來的一點燈火活著。劍「螢火」（陳伯所贈）、紅繩手環、做燈工具。<br>
      十款方案由「清代臺灣閩南勞動少年」的寫實造型（對襟短衫、大褲、綁腿、草鞋、薙髮留辮／頭巾）一路推到武俠與奇幻詮釋；
      每款皆考量卡通渲染 3D 建模：大塊面主形、多角度可辨剪影、細節以貼圖表現。</div></div>`;
    const lu = document.createElement('div'); lu.className = 'lineup';
    lu.innerHTML = '<div class="lab"><b>剪影排列 lineup</b><br>10 款正面剪影 @ 90 px<br>（地圖精靈比例）</div>';
    sheet.appendChild(lu);
    D.forEach((d) => { const c = lineupSil(d, dpr); lu.appendChild(c); });
    const grid = document.createElement('div'); grid.className = 'grid'; sheet.appendChild(grid);
    D.forEach((d) => grid.appendChild(renderCard(d, dpr)));
  }
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
