<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Shorelight 3D asset viewer</title>
<style>
  html, body { margin: 0; background: #1b1d22; color: #ddd; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
  #c { display: block; }
  .lb { position: absolute; transform: translate(-50%, 0); padding: 2px 6px; background: rgba(0,0,0,.55); border-radius: 4px; white-space: nowrap; pointer-events: none; }
  #info { position: absolute; left: 8px; top: 6px; opacity: .8; }
</style></head>
<body>
<canvas id="c"></canvas><div id="info"></div>
<!--
  Shorelight 3D asset viewer: model / character / creature lineups for fast iteration and screenshots.
  Params:
    kind=models|chars|mons          (default models)
    ids=a,b,c                       (default: everything registered of that kind; group=prefix filters ids)
    views=1|4                       chars/mons: 4 = front, 3/4, side, back of each id
    yaw=deg pitch=deg dist=k        camera (dist = multiplier of the auto-fit distance)
    anim=walk|run|idle|<clip> t=s   chars/mons: locomotion or clip, advanced deterministically to time t
    expr=<expression> cols=n w=px h=px  ground=0 labels=0 night=1 fallback=1 (compare with 2D-art billboards)
  window.__ready becomes true after the frame is drawn.
-->
<script>window.G_VIEWER = true;</script>
<script src="../../../js/core/util.js"></script>
<script>G.settings = Object.assign({ quality: 'high', lang: 'zh', visualFx: 1 }, G.settings || {}); G.time = 0;
  G.Render = G.Render || { shakeOffset: () => [0, 0], fade: { a: 0 } }; G.warnOnce = G.warnOnce || ((k, e) => console.warn(k, e));</script>
<script src="../../../js/gfx/registry.js"></script>
<script src="../../../js/gfx/tiles.js"></script>
<script src="../../../js/gfx/nature.js"></script>
<script src="../../../js/gfx/objects.js"></script>
<script src="../../../js/gfx/objects2.js"></script>
<script src="../../../js/gfx/interior.js"></script>
<script src="../../../js/gfx/sprites.js"></script>
<script src="../../../js/gfx/monsters.js"></script>
<script src="../../../js/gfx/monsters2.js"></script>
<script src="../../../js/gfx/monsters3.js"></script>
<script src="../../../js/vendor/three.bundle.js"></script>
<script src="../../../js/r3d/core.js"></script>
<script src="../../../js/r3d/materials.js"></script>
<script src="../../../js/r3d/models.js"></script>
<script src="../../../js/r3d/chars.js"></script>
<script src="../../../js/r3d/chars_cast.js"></script>
<script src="../../../js/r3d/animals.js"></script>
<script src="../../../js/r3d/arch_han.js"></script>
<script src="../../../js/r3d/arch_coast.js"></script>
<script src="../../../js/r3d/nature.js"></script>
<script src="../../../js/r3d/props.js"></script>
<script src="../../../js/r3d/monsters.js"></script>
<script src="../../../js/r3d/monsters_boss.js"></script>
<script src="../../../js/r3d/env.js"></script>
<script src="../../../js/r3d/vfx.js"></script>
<script>
setTimeout(function () {
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);
  const kind = q.get('kind') || 'models';
  const W = num('w', 1280), H = num('h', 720);
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  G.R3.renderer = renderer;
  const scene = new THREE.Scene();
  const night = q.get('night') === '1';
  scene.background = new THREE.Color(night ? 0x0b1020 : 0x8fb4d0);
  scene.add(new THREE.HemisphereLight(night ? 0x5a6a9a : 0xdfeaf5, 0x5a4a3a, night ? 0.35 : 1.15));
  const sun = new THREE.DirectionalLight(night ? 0x9fb6ff : 0xfff0d8, night ? 0.4 : 2.8);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
  scene.add(sun, sun.target);
  try {
    const pm = new THREE.PMREMGenerator(renderer);
    const es = new THREE.Scene();
    const sky = new THREE.Mesh(new THREE.SphereGeometry(10, 16, 8), new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: night ? 0x1a2240 : 0xbcd4e6 }));
    es.add(sky);
    scene.environment = pm.fromScene(es, 0.04).texture; scene.environmentIntensity = 0.55;
  } catch (e) { console.warn(e); }

  // collect ids
  let ids = q.get('ids') ? q.get('ids').split(',').filter(Boolean) : null;
  const group = q.get('group');
  if (!ids) {
    if (kind === 'models') ids = Object.keys(G.Models.defs);
    else if (kind === 'chars') ids = G.Sprites.ids();
    else ids = Object.keys(G.Monsters.defs);
  }
  if (group) ids = ids.filter((i) => i.startsWith(group));
  const views = num('views', 1);
  const fallback = q.get('fallback') === '1';
  const anim = q.get('anim') || 'idle', T = num('t', 0.5);

  const items = [];
  // props_street harness: items=[{"t":"stall","text":"鮮魚"},…] (JSON) gives per-item params; ids=… still works
  const specs = q.get('items') ? JSON.parse(q.get('items')) : ids.map((id) => ({ t: id }));
  ids = specs.map((s) => s.t);
  for (const [si, spec] of specs.entries()) { const id = spec.t;
    for (let v = 0; v < views; v++) {
      let obj = null, inst = null, o = null;
      try {
        if (kind === 'models') {
          const d = G.Objects.get(id) || { w: 1, h: 1 };
          o = Object.assign({ t: id, x: si * 3, y: 0, v: num('v', 0), open: q.get('open') === '1', w: d.w, h: d.h }, spec);
          obj = (!fallback && G.Models.has(id)) ? G.Models.create(id, o) : G.Models.billboard(o);
          if (obj && !G.Models.has(id)) obj.userData.isFallback = true;
        } else if (kind === 'chars') {
          inst = (!fallback && G.Char3D && G.Char3D.has && G.Char3D.has(id)) ? G.Char3D.create(id, { context: 'battle' }) : new G.Models.CharBillboard(id);
        } else {
          inst = (!fallback && G.Mon3D && G.Mon3D.has && G.Mon3D.has(id)) ? G.Mon3D.create(id, { context: 'battle' }) : G.Models.monsterBillboard(id, { height: (G.Monsters.get(id) ? G.Monsters.get(id).h / 64 : 2) });
        }
      } catch (e) { console.error('build failed', id, e); }
      if (inst) obj = inst.root;
      if (!obj) { obj = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true })); }
      const yaw = [0, -Math.PI / 4, -Math.PI / 2, Math.PI][v] || 0;
      items.push({ o, id, obj, inst, yaw, label: id + (views > 1 ? ['', ' ¾', ' side', ' back'][v] : '') + (obj.userData.isFallback || (inst && inst.isFallback) ? ' (2D fallback)' : '') });
      scene.add(obj);
    }
  }
  // animate deterministically to time T
  const camYaw = num('yaw', 20) * Math.PI / 180;
  for (const it of items) if (it.inst) {
    const ins = it.inst;
    ins.setFacing && ins.setFacing(it.yaw);
    if (anim === 'walk') ins.setMove && ins.setMove(4.2);
    else if (anim === 'run') ins.setMove && ins.setMove(7);
    else if (anim !== 'idle' && ins.play) ins.play(anim, { loop: true });
    if (q.get('expr') && ins.setExpression) ins.setExpression(q.get('expr'));
  }
  const steps = Math.round(T * 60);
  // layout: bounding boxes in a grid
  const boxes = items.map((it) => { it.obj.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(it.obj); return b.isEmpty() ? new THREE.Box3(new THREE.Vector3(-0.5, 0, -0.5), new THREE.Vector3(0.5, 1, 0.5)) : b; });
  const cols = num('cols', Math.ceil(Math.sqrt(items.length * 1.8)));
  const cell = Math.max(1.4, ...boxes.map((b) => Math.max(b.max.x - b.min.x, b.max.z - b.min.z))) + 0.6;
  items.forEach((it, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    it.obj.position.x += c * cell; it.obj.position.z += r * cell;
  });
  for (let s = 0; s < steps; s++) {
    G.time = s / 60;
    for (const it of items) if (it.inst && it.inst.update) it.inst.update(1 / 60, camYaw, null);
    for (const it of items) if (!it.inst && it.obj.userData.modelId && G.Models.defs[it.obj.userData.modelId].update) {
      try { G.Models.defs[it.obj.userData.modelId].update(it.obj, it.o || { t: it.id }, s / 60, 1 / 60); } catch (e) { console.error('update', it.id, e); }
    }
  }
  const all = new THREE.Box3();
  for (const it of items) all.expandByObject(it.obj);
  const ctr = all.getCenter(new THREE.Vector3()), size = all.getSize(new THREE.Vector3());
  if (q.get('ground') !== '0') {
    const gc = document.createElement('canvas'); gc.width = gc.height = 256;
    const g = gc.getContext('2d'); g.fillStyle = '#6e7a5e'; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 2; g.strokeRect(0, 0, 256, 256);
    const tx = new THREE.CanvasTexture(gc); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.colorSpace = THREE.SRGBColorSpace;
    const gs = Math.max(size.x, size.z) + 20; tx.repeat.set(gs, gs);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(gs, gs), new THREE.MeshStandardMaterial({ map: tx, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; ground.position.set(ctr.x, 0, ctr.z); ground.receiveShadow = true;
    scene.add(ground);
  }
  const cam = new THREE.PerspectiveCamera(num('fov', 30), W / H, 0.05, 500);
  const pitch = num('pitch', 28) * Math.PI / 180;
  const radius = Math.max(size.x, size.y * 1.6, size.z) * 0.5 + 0.5;
  const dist = radius / Math.tan(cam.fov * Math.PI / 360) * 1.15 * num('dist', 1);
  const look = ctr.clone(); look.y = size.y * 0.42;
  cam.position.set(look.x + Math.sin(camYaw) * Math.cos(pitch) * dist, look.y + Math.sin(pitch) * dist, look.z + Math.cos(camYaw) * Math.cos(pitch) * dist);
  cam.lookAt(look);
  sun.position.copy(look).add(new THREE.Vector3(-12, 20, 9)); sun.target.position.copy(look); sun.target.updateMatrixWorld();
  const sc = sun.shadow.camera; const r2 = radius * 1.5 + 2; sc.left = -r2; sc.right = r2; sc.top = r2; sc.bottom = -r2; sc.far = 80; sc.updateProjectionMatrix();
  for (const it of items) it.obj.traverse((n) => { if (n.isMesh && !n.userData.outline) { if (n.castShadow === undefined) n.castShadow = true; n.receiveShadow = true; } if (n.userData.billboard) n.rotation.y = camYaw; });
  // real point lights from lights(o) (the game pools these; here every one is added)
  if (q.get('lights') !== '0') for (const it of items) {
    const md = G.Models.defs[it.id];
    if (!md || !md.lights || !it.o) continue;
    for (const l of md.lights(it.o) || []) {
      const pl = new THREE.PointLight(l.color || '#ffb060', (l.intensity || 1) * (night ? 6 : 2.5), l.distance || 4, 1.6);
      pl.position.set(it.obj.position.x + (l.x || 0), l.y != null ? l.y : 1.2, it.obj.position.z + (l.z || 0));
      scene.add(pl);
    }
  }
  G.R3M.cutUniforms().uResolution.value.set(W, H);
  renderer.render(scene, cam);
  // labels
  if (q.get('labels') !== '0') items.forEach((it, i) => {
    const b = new THREE.Box3().setFromObject(it.obj);
    const p = new THREE.Vector3((b.min.x + b.max.x) / 2, 0, b.max.z).project(cam);
    const d = document.createElement('div'); d.className = 'lb'; d.textContent = it.label;
    d.style.left = ((p.x * 0.5 + 0.5) * W) + 'px'; d.style.top = ((-p.y * 0.5 + 0.5) * H + 4) + 'px';
    document.body.appendChild(d);
  });
  const info = renderer.info.render;
  document.getElementById('info').textContent = `${kind} · ${items.length} items · ${info.calls} calls · ${info.triangles} tris`;
  window.__stats = { calls: info.calls, tris: info.triangles, items: items.length, fallbacks: items.filter((i) => i.label.includes('fallback')).length };
  window.__stats.per = items.map((it) => {
    let meshes = 0, tris = 0, nan = false;
    it.obj.traverse((n) => {
      if (!(n.isMesh || n.isPoints) || !n.geometry) return;
      meshes++;
      const g = n.geometry; tris += n.isPoints ? 0 : (g.index ? g.index.count : g.attributes.position.count) / 3;
      g.computeBoundingSphere(); if (!isFinite(g.boundingSphere.radius)) nan = true;
    });
    const b = new THREE.Box3().setFromObject(it.obj), p = it.obj.position;
    return { id: it.id, meshes, tris: Math.round(tris), nan, box: [b.min.x - p.x, b.min.y, b.min.z - p.z, b.max.x - p.x, b.max.y, b.max.z - p.z].map((v) => +v.toFixed(2)) };
  });
  window.__ready = true;
}, 0);
</script>
</body></html>
