<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Monsters 2 Preview</title>
<style>
  html, body { margin: 0; background: #07080d; color: #ccd; font: 13px sans-serif; }
  #bar { padding: 6px 10px; position: sticky; top: 0; background: #0d0f18; z-index: 2; }
  #bar a { color: #9cf; margin-right: 10px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="bar"></div>
<canvas id="c"></canvas>
<script src="../js/core/util.js"></script>
<script src="../js/core/font.js"></script>
<script src="../js/gfx/registry.js"></script>
<script src="../js/gfx/monsters2.js"></script>
<script>
'use strict';
// Query params:
//   mode=grid|detail|perf   id=<monster id> (detail)   t=<seconds> (freeze time)   bg=dark|light|scene
//   ids=a,b,c (grid subset)  cols=N  cell=WxH  scale=N (canvas zoom)
const Q = new URLSearchParams(location.search);
const mode = Q.get('mode') || 'grid';
const freezeT = Q.has('t') ? parseFloat(Q.get('t')) : null;
const bgMode = Q.get('bg') || 'dark';
const zoom = parseFloat(Q.get('scale') || '1');
G.S = 1;
const ids = Q.get('ids') ? Q.get('ids').split(',') : Object.keys(G.Monsters.defs);
const NAMES = {
  marionette: '傀儡', lantern_golem: '長明燈傀', linto_jie: '林投姐', nether_guardian: '冥燈護法',
  fog_spirit: '霧精', bear_spirit: '黑熊精', hundred_eye: '百眼', serpent_shade: '蛇影', inner_demon: '心魔',
  jiao: '蛟', stone_guardian: '石像衛', lamp_moth: '燈蛾', drowned_soldier: '溺屍兵', tide_grudge: '潮怨',
  drowned_swarm: '溺魂群', kun: '鯤', lily_demon: '彼岸花妖', faceless: '無面鬼', tower_warden: '燈塔守',
  jewel_child: '萬象童子', baibu: '雲蛇', wuxiang: '黑潮・無相',
};
const BOSSES = { linto_jie: 1, nether_guardian: 1, wuxiang: 1, kun: 1 };
const bar = document.getElementById('bar');
if (Q.has('shot')) bar.style.display = 'none';
bar.innerHTML = '<a href="?mode=grid">grid</a><a href="?mode=grid&bg=light">grid(light)</a><a href="?mode=perf">perf</a> | ' +
  ids.map((id) => `<a href="?mode=detail&id=${id}">${NAMES[id] || id}</a>`).join('');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const errors = [];
window.addEventListener('error', (e) => errors.push(String(e.message)));

function bg(w, h) {
  if (bgMode === 'light') {
    const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#8a96a6'); g.addColorStop(1, '#5a6070');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); return;
  }
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0b0d18'); g.addColorStop(1, '#141826');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}
function cell(id, cx, cy, cw, ch, t, o, label) {
  const d = G.Monsters.get(id);
  ctx.save();
  ctx.beginPath(); ctx.rect(cx, cy, cw, ch); ctx.clip();
  // floor
  const fy = cy + ch - 18;
  const fg = ctx.createRadialGradient(cx + cw / 2, fy, 2, cx + cw / 2, fy, cw * 0.45);
  fg.addColorStop(0, 'rgba(120,140,200,0.18)'); fg.addColorStop(1, 'rgba(120,140,200,0)');
  ctx.fillStyle = fg; ctx.fillRect(cx, fy - 40, cw, 60);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(cx + cw / 2, fy, (d ? d.w : 100) * 0.35, 8, 0, 0, Math.PI * 2); ctx.fill();
  const sc = d ? Math.min(1, (ch - 60) / (d.h * 1.25), (cw - 16) / (d.w * 1.4)) : 1;
  ctx.translate(cx + cw / 2, fy); ctx.scale(sc, sc);
  if (d && Q.has('box')) {
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.setLineDash([4, 4]);
    ctx.strokeRect(-d.w / 2, -d.h, d.w, d.h); ctx.setLineDash([]);
  }
  try { G.Monsters.draw(ctx, id, 0, 0, t, o); } catch (e) { errors.push(id + ': ' + e.message); console.error(e); }
  ctx.restore();
  ctx.fillStyle = bgMode === 'light' ? '#fff' : '#e8dcc0';
  ctx.font = G.font(16, true);
  ctx.fillText(label, cx + 8, cy + 20);
  ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(200,210,230,0.7)';
  ctx.fillText(d ? `${d.w}x${d.h}${sc < 1 ? '  @' + sc.toFixed(2) : ''}` : 'missing', cx + 8, cy + 34);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.strokeRect(cx + 0.5, cy + 0.5, cw - 1, ch - 1);
}

let layout;
if (mode === 'grid') {
  const [cw, ch] = (Q.get('cell') || '320x300').split('x').map(Number);
  const cols = parseInt(Q.get('cols') || '6');
  const rows = Math.ceil(ids.length / cols);
  layout = { w: cols * cw, h: rows * ch, draw(t) {
    bg(this.w, this.h);
    ids.forEach((id, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      cell(id, c * cw, r * ch, cw, ch, t + i * 0.37, { state: 'idle', st: t }, `${NAMES[id] || ''} ${id}`);
    });
  } };
} else if (mode === 'detail') {
  const id = Q.get('id');
  const d = G.Monsters.get(id) || { w: 140, h: 160 };
  const cw = Math.max(300, Math.round(d.w * 1.5 + 40)), ch = Math.max(280, Math.round(d.h * 1.3 + 80));
  const rowsDef = [
    [['idle', { state: 'idle' }], ['attack .12', { state: 'attack', st: 0.12 }], ['attack .40', { state: 'attack', st: 0.4 }],
     ['hurt .10', { state: 'hurt', st: 0.1 }], ['cast .60', { state: 'cast', st: 0.6 }]],
    [['variant 0', { variant: 0 }], ['variant 1', { variant: 1 }], ['variant 2', { variant: 2 }]],
  ];
  if (BOSSES[id] || Q.has('phases')) rowsDef.push([['phase 1', { phase: 1 }], ['phase 2', { phase: 2 }], ['phase 3', { phase: 3 }], ['p3 cast', { phase: 3, state: 'cast', st: 0.6 }]]);
  const cols = Math.max(...rowsDef.map((r) => r.length));
  layout = { w: cols * cw, h: rowsDef.length * ch, draw(t) {
    bg(this.w, this.h);
    rowsDef.forEach((row, r) => row.forEach(([label, o], c) => {
      const oo = Object.assign({ state: 'idle', st: t }, o);
      if (o.st == null) oo.st = t % 3; // animate states live
      if (freezeT == null && o.state && o.state !== 'idle') oo.st = (t * 0.6) % 1.2;
      if (freezeT != null && o.st != null) oo.st = o.st;
      cell(id, c * cw, r * ch, cw, ch, t, oo, `${NAMES[id] || id} · ${label}`);
    }));
  } };
} else if (mode === 'perf') {
  const list = (Q.get('ids') || 'wuxiang,kun,baibu,nether_guardian,linto_jie').split(',');
  layout = { w: 1280, h: 720, draw(t) {
    bg(1280, 720);
    list.forEach((id, i) => G.Monsters.draw(ctx, id, 140 + i * 250, 600, t, { state: 'idle', st: t, phase: 2 }));
  } };
}
cv.width = layout.w * zoom; cv.height = layout.h * zoom;
cv.style.width = layout.w * zoom + 'px';
function frame(now) {
  const t = freezeT != null ? freezeT : now / 1000;
  ctx.setTransform(zoom, 0, 0, zoom, 0, 0);
  layout.draw(t);
  if (freezeT == null && mode !== 'perf') requestAnimationFrame(frame);
}
if (mode === 'perf') {
  // warm up caches then time 120 frames
  layout.draw(0);
  const t0 = performance.now();
  for (let i = 0; i < 120; i++) { ctx.setTransform(1, 0, 0, 1, 0, 0); layout.draw(i / 60); }
  const ms = (performance.now() - t0) / 120;
  document.title = 'PERF ' + ms.toFixed(2) + 'ms/frame';
  window.PERF = ms;
  ctx.fillStyle = '#fff'; ctx.font = '20px monospace'; ctx.fillText(document.title, 20, 30);
} else {
  requestAnimationFrame(frame);
}
window.ERRORS = errors;
window.READY = true;
</script>
</body>
</html>
